ntrols.t.m":"CONTROLS: PHONE OR TABLET","pop.controls.1":"A / D OR ← →: MOVE.  W, ↑ OR SPACE: JUMP (HOLD IT TO JUMP HIGHER).  S OR ↓: DROP THROUGH A PLATFORM.","pop.controls.2":"MOUSE: AIM (THE CROSSHAIR).  LEFT CLICK OR E: THROW A LEPTON (HOLD TO KEEP THROWING).","pop.controls.3":"SHIFT OR K: DODGE.  RIGHT CLICK, Z OR Q: Z PULSE.","pop.controls.4":"ESC OR P: PAUSE AND PHYSICS CODEX.  F: FULLSCREEN.  M: SOUND ON / OFF.","pop.controls.5":"IN TRAINING, TAB SKIPS A LESSON.","pop.controls.1.m":"LEFT THUMB: A STICK APPEARS WHERE YOU TOUCH THE LEFT HALF. SLIDE TO MOVE, PUSH UP TO JUMP (KEEP IT UP TO JUMP HIGHER), PULL DOWN TO DROP.","pop.controls.2.m":"RIGHT THUMB: TOUCH THE RIGHT HALF AND SLIDE TOWARDS A TARGET TO AIM. HOLD TO KEEP THROWING; A QUICK TAP THROWS ONCE.","pop.controls.3.m":"SWIPE QUICKLY LEFT OR RIGHT AND LET GO: DODGE.","pop.controls.4.m":"Z⁰ BUTTON (BOTTOM RIGHT): Z PULSE, IT HITS EVERY FLAVOUR NEARBY.","pop.controls.5.m":"HOLD THE SCREEN SIDEWAYS. FULLSCREEN, CODEX, SOUND AND PAUSE ARE TOP RIGHT.","menu.fullscreen.on":"FULLSCREEN (F)","menu.fullscreen.off":"EXIT FULLSCREEN (ESC)","menu.teacher":"TEACHER","menu.scores":"HIGH SCORES","menu.codex":"PHYSICS CODEX","menu.quiz":"QUICK QUIZ","menu.back":"BACK","menu.resume":"RESUME","menu.restart":"RESTART","menu.quit":"QUIT TO TITLE","menu.continue":"CONTINUE","menu.next":"NEXT","menu.prev":"PREV","menu.done":"DONE","menu.ok":"OK","menu.skipq":"SKIP",paused:"PAUSED",settings:"SETTINGS","set.lang":"LANGUAGE","set.lang.v":"ENGLISH","set.aim":"AIM","set.aim.auto":"AUTO","set.aim.mouse":"MOUSE","set.mode":"MODE","set.mode.osc":"REAL OSCILLATION","set.mode.arcade":"ARCADE (DODGE = NEXT FLAVOUR)","set.music":"MUSIC","set.sound":"SOUND","set.cards":"PHYSICS CARDS","set.autofire":"AUTO-THROW","set.fullscreen":"FULLSCREEN","set.booth":"BOOTH MODE (AUTO-RESET)",on:"ON",off:"OFF","keys.1":"A/D OR ←/→ MOVE   W/SPACE JUMP (HOLD = KEEP JUMPING)   S DROP","keys.2":"MOUSE AIMS   LEFT CLICK / E: THROW   SHIFT: DODGE   RIGHT CLI "ENRAGED","boss.split":"IT SPLITS!",chilled:"CHILLED","fl.0":"e","fl.1":"μ","fl.2":"τ","fl.name.0":"ELECTRON","fl.name.1":"MUON","fl.name.2":"TAU","nu.0":"νe","nu.1":"νμ","nu.2":"ντ","stage.0.name":"TRAINING POOL","stage.0.where":"THE POOL OF A RESEARCH REACTOR","stage.0.body":"RESEARCH REACTORS LIKE THE TRIGA AT THE JOŽEF STEFAN INSTITUTE NEAR LJUBLJANA SIT AT THE BOTTOM OF A POOL OF WATER. TRIGA STANDS FOR TRAINING, RESEARCH, ISOTOPES, GENERAL ATOMICS. THE BLUE GLOW AROUND THE CORE IS CHERENKOV LIGHT. YOU ARE A MUON NEUTRINO (νμ) FROM A COSMIC-RAY SHOWER, PASSING THROUGH WITH 1 GeV. LEARN TO MOVE, THROW LEPTONS AND CHANGE FLAVOUR.","stage.1.name":"INSIDE THE SUN","stage.1.where":"FROM THE CORE (15 MILLION °C) OUT TO THE SURFACE","stage.1.body":"FUSION TURNS HYDROGEN INTO HELIUM AND MAKES ELECTRON NEUTRINOS: 65 BILLION OF THEM CROSS EVERY SQUARE CENTIMETRE OF YOUR SKIN EACH SECOND. YOU ARE A νe WITH 10 MeV. WATCH THE BARS: THE DENSE PLASMA ITSELF CHANGES HOW YOU OSCILLATE (THE MSW EFFECT). ON THE WAY OUT ONLY ABOUT ONE THIRD OF YOU STAYS νe.","stage.2.name":"DAYA BAY","stage.2.where":"REACTOR ANTINEUTRINO DETECTORS IN A WATER POOL, CHINA","stage.2.body":"NUCLEAR REACTORS ARE THE STRONGEST NEUTRINO SOURCES WE BUILD: SLOVENIA'S KRŠKO PLANT ALONE SENDS OUT ABOUT 4×10²⁰ ELECTRON ANTINEUTRINOS EVERY SECOND. AT DAYA BAY IN CHINA, DETECTORS STOOD IN WATER POOLS 0.5 TO 2 KM FROM SIX REACTOR CORES. YOU ARE AN ELECTRON ANTINEUTRINO ("+st+"e) WITH 4 MeV. WATCH FOR A SMALL FAST DIP (θ₁₃, FOUND HERE IN 2012) AND A BIG SLOW ONE (θ₁₂, SEEN BY KAMLAND).","stage.3.name":"THE ATMOSPHERE","stage.3.where":"OVER THE PIERRE AUGER OBSERVATORY, ARGENTINA","stage.3.body":"COSMIC RAYS FROM SPACE SMASH INTO AIR NUCLEI HIGH ABOVE THE GROUND AND MAKE SHOWERS OF PIONS, WHICH DECAY INTO MUONS AND MUON NEUTRINOS. THE PIERRE AUGER OBSERVATORY CATCHES SUCH SHOWERS WITH 1,660 WATER TANKS LIKE THIS ONE, SPREAD OVER 3,000 KM². YOU ARE A νμ WITH 1 GeV. OVER A FEW HUNDRED KM YOU SWING FROM μ TO τ AND BACK: THIS IS HOW OSCILLATION WAS DISCOVERED IN 1998.","stage.4.name":"THROUGH THE EARTH TO ICECUBE","stage.4.where":"UP THROUGH THE WHOLE EARTH, INTO THE SOUTH POLE ICE","stage.4.body":'YOU CAME UP THROUGH THE WHOLE EARTH, AS ALMOST EVERY NEUTRINO DOES, UNTOUCHED. YOU ARE A νμ WITH 6 GeV, AND THE DENSE ROCK HELPS νμ TURN INTO νe, BUT ONLY IF THE MASS ORDERING IS "NORMAL". NOW YOU ARE IN ICECUBE: 5,160 LIGHT SENSORS ON 86 STRINGS, 1.5 TO 2.5 KM DEEP IN THE ANTARCTIC ICE. THE BUILDING ON TOP IS THE ICECUBE LAB.',"stage.5.name":"SUPER-KAMIOKANDE","stage.5.where":"1 KM UNDER MOUNT IKENO, JAPAN","stage.5.body":"A STEEL TANK 41 M TALL WITH 50,000 TONNES OF ULTRA-PURE WATER, LINED WITH 11,000 PHOTOMULTIPLIERS. YOU ARE A νμ FROM THE T2K BEAM, SENT 295 KM THROUGH THE ROCK FROM TOKAI, WITH 0.6 GeV. YOUR LEPTONS DRAW RINGS OF CHERENKOV LIGHT ON THE WALLS: SHARP FOR μ, FUZZY FOR e.","stage.real":"REAL EXPERIMENTS","stage.0.short":"TRAINING","stage.1.short":"THE SUN","stage.2.short":"DAYA BAY","stage.3.short":"ATMOSPHERE","stage.4.short":"ICECUBE","stage.5.short":"SUPER-K","stage.0.real":"TRIGA RESEARCH REACTORS, E.G. JSI LJUBLJANA","stage.1.real":"HOMESTAKE, SUPER-K, SNO, BOREXINO","stage.2.real":"DAYA BAY, RENO, DOUBLE CHOOZ, KAMLAND, JUNO","stage.3.real":"PIERRE AUGER (COSMIC RAYS), SUPER-K, ICECUBE","stage.4.real":"ICECUBE, KM3NET/ORCA, SUPER-K","stage.5.real":"SUPER-K AND T2K, HYPER-K, NOVA, DUNE","stage.you":"YOU","stage.energy":"ENERGY","stage.matter":"MATTER","stage.medium":"LIGHT HERE","medium.water":"WATER: CHERENKOV CONE 41°","medium.plasma":"PLASMA: OPAQUE, LIGHT IS SWALLOWED","medium.air":"AIR: A NARROW 1.4° CONE","medium.rock":"ROCK: OPAQUE","medium.ice":"ICE: CHERENKOV CONE 40°","sun.core":"CORE · 15 MILLION °C","sun.rad":"RADIATIVE ZONE","sun.rad.sub":"LIGHT ZIGZAGS OUT","sun.conv":"CONVECTION ZONE","sun.surf":"SURFACE · 5500 °C","sun.corona":"CORONA · MILLIONS OF °C","photo.juno":"PICTURE: THE JUNO DETECTOR, CHINA","photo.core":"PICTURE: A RESEARCH REACTOR CORE","matter.0":"NONE TO SPEAK OF","matter.1":"VERY DENSE, THINNING OUT (MSW)","matter.2":"WATER (TOO LITTLE TO MATTER)","matter.3":"THIN AIR","matter.4":"THE WHOLE EARTH (MATTER EFFECT)","matter.5":"WATER (TOO LITTLE TO MATTER)","boss.blobqueen.intro":"1968: RAY DAVIS COUNTED SOLAR νe WITH 615 TONNES OF CLEANING FLUID DEEP IN THE HOMESTAKE MINE. HE FOUND ONLY ABOUT ONE THIRD OF WHAT THE SUN SHOULD MAKE. FOR 30 YEARS NOBODY KNEW WHERE THE REST WENT.","boss.blobqueen.tip":"WEAK TO μ AND τ. YOUR Z PULSE (RIGHT CLICK) SEES ALL FLAVOURS: IT HITS ×3.","boss.blobqueen.defeat":"2001-2002: SNO IN CANADA USED HEAVY WATER TO COUNT ONLY νe (CHARGED CURRENT) AND ALL FLAVOURS AT ONCE (NEUTRAL CURRENT). ALL FLAVOURS TOGETHER GAVE THE FULL SOLAR FLUX: NOTHING WAS MISSING, THE νe HAD CHANGED INTO νμ AND ντ. NOBEL PRIZES 2002 (DAVIS, KOSHIBA) AND 2015 (McDONALD).","boss.warden.intro":"THREE MIXING ANGLES SAY HOW FLAVOURS AND MASS STATES MIX. θ₁₂ AND θ₂₃ ARE LARGE. THE THIRD, θ₁₃, WAS SO SMALL THAT IT STAYED HIDDEN UNTIL 2012.","boss.warden.tip":"WEAK TO μ AND τ: THE FEW ANTINEUTRINOS THAT STOP BEING e.","boss.warden.defeat":"2012: DAYA BAY (CHINA), RENO (KOREA) AND DOUBLE CHOOZ (FRANCE) SAW ABOUT 6% OF REACTOR ANTINEUTRINOS VANISH AFTER 1-2 KM: θ₁₃ ≈ 8.6°. SMALL, BUT NOT ZERO, AND THAT MAKES THE SEARCH FOR CP VIOLATION POSSIBLE.","boss.throneeye.intro":"IN THE 1980S AND 90S, DETECTORS COUNTED TOO FEW MUON NEUTRINOS FROM THE ATMOSPHERE. A MISTAKE IN THE MODELS? OR SOMETHING NEW?","boss.throneeye.tip":"IT SHRUGS OFF μ. HIT IT WITH τ: THAT IS WHAT THE MISSING νμ BECAME.","boss.throneeye.defeat":"1998: SUPER-KAMIOKANDE SHOWED THAT νμ COMING UP THROUGH THE EARTH (13,000 KM) WERE MISSING, WHILE THOSE FROM ABOVE (15 KM) WERE NOT. THE DEFICIT FOLLOWED L/E EXACTLY: OSCILLATION! THE FIRST PROOF THAT NEUTRINOS HAVE MASS. NOBEL PRIZE 2015 (KAJITA).","boss.king.intro":'WE KNOW THE DIFFERENCES OF THE SQUARED NEUTRINO MASSES, BUT NOT THEIR ORDER. IS ν₃ THE HEAVIEST ("NORMAL") OR THE LIGHTEST ("INVERTED")?',"boss.king.tip":"IT FLIPS ITS ORDER. NORMAL: WEAK TO e. INVERTED: WEAK TO μ.","boss.king.defeat":"STILL AN OPEN QUESTION! JUNO (CHINA), DUNE (USA), HYPER-KAMIOKANDE (JAPAN), ICECUBE AND KM3NET/ORCA IN THE MEDITERRANEAN ARE ON IT. MATTER IN THE EARTH BOOSTS νμ→νe ONLY FOR ONE OF THE TWO ORDERINGS.","boss.brood.intro":"THE PHASE δCP COULD MAKE NEUTRINOS AND ANTINEUTRINOS OSCILLATE DIFFERENTLY. THAT COULD HELP EXPLAIN WHY THE UNIVERSE IS MADE OF MATTER AND NOT ANTIMATTER.","boss.brood.tip":"ITS WEAKNESS TURNS WITH THE NEEDLE. HALFWAY, THE BEAM FLIPS YOU INTO AN ANTINEUTRINO.","boss.brood.defeat":"STILL OPEN! T2K AND NOVA SEE HINTS. DUNE AND HYPER-KAMIOKANDE, STARTING IN THE LATE 2020S, AIM FOR A DISCOVERY. MAYBE YOU WILL BE ON THE TEAM.","boss.history":"HISTORY","boss.tip":"HOW TO BEAT IT","boss.solved":"SOLVED","boss.open":"STILL OPEN","pop.throw0.t":"ELECTRON!","pop.throw0.b":'YOUR νe HIT A NUCLEUS AND TURNED INTO AN ELECTRON BY SWAPPING A W BOSON (A "CHARGED CURRENT"). A LIGHT ELECTRON SCATTERS A LOT AND MAKES A SHOWER: ITS CHERENKOV CONE IS FUZZY AND FILLED, AND ON THE WALL IT MAKES A BLURRED RING.',"pop.throw1.t":"MUON!","pop.throw1.b":"THE MUON IS 200 TIMES HEAVIER THAN THE ELECTRON. IT FLIES STRAIGHT AND FAR, PIERCING EVERYTHING IN ITS WAY. ITS CHERENKOV CONE IS SHARP AND HOLLOW: WHEN THE TRACK ENDS, THE LIGHT FLIES ON AS A RING WITH A HOLE IN THE MIDDLE.","pop.throw2.t":"TAU!","pop.throw2.b":'THE TAU IS 3,500 TIMES HEAVIER THAN THE ELECTRON AND DECAYS ALMOST AT ONCE: ONE BANG WHERE IT IS MADE, A SECOND WHERE IT DECAYS. ICECUBE SEARCHES FOR SUCH "DOUBLE BANGS".',"pop.dice.t":"QUANTUM DICE","pop.dice.b":"WHICH LEPTON YOU THROW IS DECIDED BY CHANCE. THE BARS SHOW THE ODDS: 70% μ MEANS SEVEN THROWS IN TEN ARE MUONS. QUANTUM MECHANICS ONLY GIVES PROBABILITIES.","pop.cherenkov.t":"CHERENKOV LIGHT","pop.cherenkov.b":"IN WATER, LIGHT TRAVELS AT ONLY 75% OF ITS VACUUM SPEED. A CHARGED PARTICLE FASTER THAN THAT LEAVES A CONE OF BLUE LIGHT BEHIND, LIKE THE SONIC BOOM OF A JET: cos θ = 1/(nβ), 41° IN WATER.","pop.osc.t":"YOU CHANGED FLAVOUR!","pop.osc.b":"A NEUTRINO IS A MIX OF THREE MASS STATES ν₁, ν₂, ν₃. THEY TRAVEL WITH SLIGHTLY DIFFERENT RHYTHMS, SO THE MIX, AND YOUR FLAVOUR, DRIFTS WITH DISTANCE / ENERGY (L/E). THIS IS ONLY POSSIBLE IF NEUTRINOS HAVE MASS.","pop.pass.t":"IT WENT RIGHT THROUGH YOU","pop.pass.b":"NEUTRINOS HARDLY EVER INTERACT. A LIGHT-YEAR OF LEAD WOULD STOP ONLY ABOUT HALF OF THE NEUTRINOS FROM THE SUN. HERE ABOUT HALF OF ALL HITS PASS THROUGH YOU.","pop.nc.t":"NEUTRAL CURRENT","pop.nc.b":"WITH A Z BOSON A NEUTRINO CAN BUMP INTO MATTER WITHOUT TURNING INTO A CHARGED LEPTON. IT WORKS THE SAME FOR ALL FLAVOURS, SO IT IGNORES WEAKNESSES. SNO USED IT TO COUNT ALL SOLAR NEUTRINOS.","pop.w.t":"W BOSON: YOU ARE A CHARGED LEPTON","pop.w.b":"ABSORBING A W TURNS A NEUTRINO INTO ITS CHARGED PARTNER. CHARGED PARTICLES FEEL ELECTRIC FORCES: NOTHING PASSES THROUGH YOU NOW, BUT YOU HIT HARDER AND SHINE CHERENKOV LIGHT. HEAVY LEPTONS DO NOT LAST LONG...","pop.wend.0.t":"ELECTRON CAPTURE","pop.wend.0.b":"ELECTRONS ARE STABLE. HERE A PROTON CAPTURES YOU (e + p → n + νe), AND YOU ARE A νe AGAIN.","pop.wend.1.t":"MUON DECAY","pop.wend.1.b":"A MUON LIVES 2.2 MICROSECONDS, THEN DECAYS: μ → e + "+st+"e + νμ. YOU ARE A νμ AGAIN.","pop.wend.2.t":"TAU DECAY","pop.wend.2.b":'A TAU LIVES 0.3 PICOSECONDS. ITS DECAY ALWAYS MAKES A ντ ("TAU REGENERATION"): YOU ARE A ντ AGAIN.',"pop.msw.t":"THE MSW EFFECT","pop.msw.b":"ELECTRON NEUTRINOS ALSO SCATTER OFF THE ELECTRONS OF THE SUN. THIS EXTRA PUSH CHANGES THE MIXING. WHERE THE DENSITY IS JUST RIGHT, νe TURNS SMOOTHLY INTO ν₂, AND ν₂ LEAVES THE SUN AS ABOUT 1/3 νe AND 2/3 νμ + ντ.","pop.anti.t":"ANTINEUTRINOS","pop.anti.b":"REACTORS MAKE ELECTRON ANTINEUTRINOS ("+st+'e), THE ANTIMATTER TWINS OF νe. THEY OSCILLATE THE SAME WAY, EXCEPT FOR THE CP PHASE. THE BAR OVER THE ν MEANS "ANTI".',"pop.flip.t":"NEUTRINO OR ANTINEUTRINO?","pop.flip.b":"BEAM EXPERIMENTS FLIP THE CURRENT IN THEIR MAGNETIC HORNS TO MAKE "+st+"μ INSTEAD OF νμ. IF THE TWO OSCILLATE DIFFERENTLY, CP SYMMETRY IS BROKEN. YOU ARE NOW A "+st+"μ!","pop.evidence.t":"3σ: EVIDENCE","pop.evidence.b":'SIGNIFICANCE GROWS LIKE THE SQUARE ROOT OF YOUR EVENTS: FOUR TIMES MORE DATA GIVES TWICE THE σ. AT 3σ A RANDOM FLUKE WOULD BE THIS BIG ONLY 0.3% OF THE TIME. PHYSICISTS CALL IT "EVIDENCE", NOT YET A DISCOVERY.',"pop.discovery.t":"5σ: DISCOVERY!","pop.discovery.b":"AT 5σ THE CHANCE OF A FLUKE IS BELOW 1 IN 3.5 MILLION. THAT IS THE RULE FOR CLAIMING A DISCOVERY IN PARTICLE PHYSICS, USED FOR OSCILLATIONS AND FOR THE HIGGS BOSON.","pop.arcade.t":"ARCADE MODE","pop.arcade.b":"IN ARCADE MODE EVERY DODGE SIMPLY SWITCHES e → μ → τ. REAL NEUTRINOS DRIFT SMOOTHLY: TRY THE REAL OSCILLATION MODE IN SETTINGS.","pop.more":"MORE IN THE PHYSICS CODEX (PAUSE MENU)","tut.move":"MOVE WITH A / D (OR ← →)","tut.jump":"JUMP WITH W, ↑ OR SPACE. HOLD IT TO KEEP JUMPING HIGHER. S OR ↓ DROPS THROUGH A PLATFORM.","tut.throw":"AIM WITH THE MOUSE: THE CROSSHAIR SHOWS WHERE THE LEPTON GOES. LEFT CLICK OR E THROWS; HOLD IT TO KEEP THROWING.","tut.bars":"BELOW: YOUR FLAVOUR MIX. ORANGE e, MAGENTA μ, VIOLET τ. EACH THROW IS ROLLED FROM THESE ODDS.","tut.travel":"NOW WALK AROUND AND WATCH THE BARS: TRAVELLING CHANGES YOUR FLAVOUR. THAT IS OSCILLATION!","tut.dodge":"DODGE WITH SHIFT (OR K) IN THE DIRECTION YOU ARE WALKING. A DODGE IS A QUICK HOP IN DISTANCE: IT FLIPS μ ↔ τ.","tut.weak":"THE LETTER ABOVE A TARGET IS ITS WEAK FLAVOUR (×2, OTHERS ×0.6). STAND STILL TO KEEP YOUR FLAVOUR, MOVE TO CHANGE IT.","tut.nc":"Z PULSE: RIGHT MOUSE BUTTON, Z OR Q. IT HITS EVERYTHING NEARBY, WHATEVER THE FLAVOUR. THE BAR BELOW SHOWS WHEN IT IS READY AGAIN.","tut.w":"A W BOSON! TOUCH IT TO BECOME A CHARGED LEPTON FOR A FEW SECONDS.","tut.wave":"LAST TEST: SURVIVE A SHOWER OF COSMIC MUONS!","tut.done":"TRAINING COMPLETE!","tut.skip":"TAB: SKIP STEP","tut.step":"TRAINING {n}/{of}","cr.title":"CONTROL ROOM","cr.cleared":"STAGE {n} CLEARED","cr.events":"EVENTS","cr.time":"TIME","cr.data":"DATA EARNED","cr.throws":"LEPTONS THROWN","cr.cards":"CARD SHOP","cr.quiz":"QUIZ BONUS","cr.repair":"REPAIR +8 HP ({p} DATA)","cr.next":"NEXT STAGE","cr.buy":"BUY","cr.sold":"SOLD","cr.reroll":"NEW CARDS {n}","cr.nodata":"NOT ENOUGH DATA","cr.full":"ALREADY AT FULL HP","cr.tap":"CLICK A CARD TO READ IT","cr.right":"CORRECT! +{n} DATA","cr.wrong":"NOT QUITE. THE ANSWER: {a}","cr.answered":"QUIZ DONE FOR THIS STAGE","cr.healed":"THE CREW PATCHED YOU UP +{n}","cr.upnext":"NEXT","res.win":"JOURNEY COMPLETE!","res.lose":"ABSORBED","res.score":"SCORE","res.stage":"STAGE REACHED","res.events":"EVENTS","res.sigma":"SIGNIFICANCE","res.time":"TIME","res.throws":"e / μ / τ THROWN","res.again":"PLAY AGAIN","res.retry":"RETRY STAGE {n}","res.retry.hint":"RETRY KEEPS YOUR CARDS AND DATA FROM THE START OF THE STAGE (ENTER)","res.title":"TITLE","res.new":"NEW HIGH SCORE! TYPE YOUR INITIALS","res.enter":"ENTER TO SAVE","res.top":"TOP 10","res.empty":"NO SCORES YET","quiz.pre":"QUICK QUIZ: WHAT DO YOU THINK?","quiz.post":"AND NOW?","quiz.pre.sub":"THREE QUESTIONS. NO WRONG GUESSES, IT HELPS US SEE WHAT YOU LEARN.","quiz.post.sub":"THE SAME THREE QUESTIONS AGAIN.","quiz.n":"QUESTION {n}/{of}","quiz.keys":"CLICK OR PRESS 1 / 2 / 3","quiz.thanks":"THANKS!","quiz.score":"BEFORE: {a}/3   AFTER: {b}/3","debrief.title":"WHAT YOU JUST DID","debrief.1":"NEUTRINOS COME IN THREE FLAVOURS AND CHANGE FLAVOUR AS THEY TRAVEL. HOW MUCH DEPENDS ON DISTANCE / ENERGY (L/E).","debrief.2":"OSCILLATION MEANS NEUTRINOS HAVE MASS, EVEN THOUGH THE STANDARD MODEL HAD ASSUMED ZERO. NOBEL PRIZE 2015.","debrief.3":"WE SEE THEM ONLY THROUGH THE CHARGED LEPTONS THEY MAKE, AS CHERENKOV RINGS IN HUGE, DEEP, CLEAN DETECTORS. THE MASS ORDERING AND CP VIOLATION ARE STILL OPEN!","debrief.qr":"READ MORE:","debrief.url":"EN.WIKIPEDIA.ORG/WIKI/NEUTRINO_OSCILLATION","teacher.title":"TEACHER STATS (THIS COMPUTER ONLY)","teacher.runs":"RUNS STARTED","teacher.wins":"JOURNEYS COMPLETED","teacher.stage":"AVERAGE STAGE REACHED","teacher.pre":"PRE-QUIZ CORRECT","teacher.post":"POST-QUIZ CORRECT","teacher.q":"Q{n}","teacher.reset":"RESET STATS","teacher.note":"ANONYMOUS COUNTS ONLY. NOTHING LEAVES THIS BROWSER.","teacher.sure":"CLICK AGAIN TO RESET","codex.n":"PAGE {n}/{of}","codex.0.t":"WHAT IS A NEUTRINO?","codex.0.b":"AN ELEMENTARY PARTICLE WITH NO ELECTRIC CHARGE AND A TINY MASS. IT FEELS ONLY THE WEAK FORCE AND GRAVITY, SO IT PASSES THROUGH ALMOST ANYTHING. WOLFGANG PAULI PROPOSED IT IN 1930 TO SAVE ENERGY CONSERVATION IN BETA DECAY. COWAN AND REINES FIRST CAUGHT IT AT A NUCLEAR REACTOR IN 1956. NEUTRINOS ARE THE MOST NUMEROUS MATTER PARTICLES IN THE UNIVERSE.","codex.1.t":"THREE FLAVOURS","codex.1.b":'ELECTRON, MUON AND TAU NEUTRINOS (νe, νμ, ντ). THE FLAVOUR IS THE CHARGED LEPTON A NEUTRINO IS MADE WITH, OR MAKES WHEN IT HITS SOMETHING THROUGH A W BOSON ("CHARGED CURRENT"): e (0.511 MeV), μ (106 MeV) OR τ (1777 MeV). WITH A Z BOSON ("NEUTRAL CURRENT") ALL FLAVOURS BEHAVE THE SAME. BETA DECAYS IN REACTORS MAKE ANTINEUTRINOS ('+st+"e).","codex.2.t":"OSCILLATION","codex.2.b":"EACH FLAVOUR IS A QUANTUM MIX OF THREE MASS STATES ν₁, ν₂, ν₃, DESCRIBED BY THE PMNS MATRIX (THREE ANGLES AND ONE PHASE). THE MASS STATES TRAVEL WITH SLIGHTLY DIFFERENT PHASES, SO THE MIX CHANGES ALONG THE WAY. FOR TWO FLAVOURS: P = sin²2θ · sin²(1.27 Δm² L/E), WITH Δm² IN eV², L IN KM, E IN GeV. NO MASS DIFFERENCE, NO OSCILLATION.","codex.3.t":"THE NUMBERS IN THIS GAME","codex.3.b":"sin²θ₁₂ = 0.307   sin²θ₂₃ = 0.546   sin²θ₁₃ = 0.022   δCP ≈ 1.36π   Δm²₂₁ = 7.5×10⁻⁵ eV²   Δm²₃₂ = 2.45×10⁻³ eV² (NORMAL ORDERING, PARTICLE DATA GROUP). THE GAME SOLVES THE FULL THREE-FLAVOUR EQUATION, WITH MATTER, EVERY FRAME. ONLY DISTANCES ARE SQUEEZED SO THAT AN OSCILLATION FITS ON SCREEN: AT 1 GeV, 200 PIXELS STAND FOR 980 KM.","codex.4.t":"MATTER AND THE MSW EFFECT","codex.4.b":"INSIDE MATTER, νe ALSO SCATTERS OFF ELECTRONS THROUGH THE W BOSON. THIS EXTRA ENERGY CHANGES THE MIXING (MIKHEYEV, SMIRNOV, WOLFENSTEIN). IN THE SUN IT TURNS HIGH-ENERGY νe INTO ν₂. IN THE EARTH IT BOOSTS νμ → νe FOR ONE MASS ORDERING AND "+st+"μ → "+st+"e FOR THE OTHER.","codex.5.t":"CHERENKOV LIGHT","codex.5.b":"A CHARGED PARTICLE FASTER THAN LIGHT IN A MATERIAL (c/n) EMITS LIGHT ON A CONE: cos θ = 1/(nβ). WATER, n = 1.33: 41°. AIR, n = 1.0003: 1.4°. THE PHOTOMULTIPLIERS ON THE WALLS SEE A RING: SHARP, WITH A HOLE IN THE MIDDLE, FOR A LONG MUON TRACK; BLURRED AND FILLED FOR AN ELECTRON SHOWER. THAT IS HOW SUPER-K TELLS νμ FROM νe. PAVEL CHERENKOV, NOBEL PRIZE 1958.","codex.6.t":"CATCHING THE UNCATCHABLE","codex.6.b":"BIG: SUPER-K HOLDS 50,000 TONNES OF WATER, ICECUBE A CUBIC KILOMETRE OF ANTARCTIC ICE. DEEP: A KILOMETRE OF ROCK STOPS MOST COSMIC MUONS. CLEAN: RADON, POTASSIUM-40, URANIUM AND THORIUM MAKE FAKE SIGNALS. EVEN THEN, SUPER-K SEES ONLY TENS OF SOLAR NEUTRINOS A DAY, WHILE A BILLION BILLION CROSS IT EVERY SECOND.","codex.7.t":"OPEN QUESTIONS","codex.7.b":"HOW HEAVY ARE NEUTRINOS? (KATRIN: LESS THAN 0.45 eV.) WHICH ONE IS THE HEAVIEST (MASS ORDERING)? DO NEUTRINOS AND ANTINEUTRINOS OSCILLATE DIFFERENTLY (CP VIOLATION)? IS THE NEUTRINO ITS OWN ANTIPARTICLE (MAJORANA)? THE NEXT GENERATION OF EXPERIMENTS IS BEING BUILT RIGHT NOW.","q.0":"A NEUTRINO IS BORN AS A νμ. FAR AWAY IT CAN BE DETECTED AS...","q.0.a0":"ONLY A νμ","q.0.a1":"A νe, νμ OR ντ","q.0.a2":"A PHOTON","q.1":"NEUTRINO OSCILLATIONS SHOW THAT NEUTRINOS...","q.1.a0":"HAVE MASS","q.1.a1":"HAVE ELECTRIC CHARGE","q.1.a2":"ARE FASTER THAN LIGHT","q.2":"WHAT DOES A WATER DETECTOR LIKE SUPER-K ACTUALLY SEE?","q.2.a0":"THE NEUTRINO ITSELF","q.2.a1":"LIGHT FROM CHARGED PARTICLES","q.2.a2":"SOUND WAVES IN THE WATER","q.3":"HOW MUCH A NEUTRINO HAS OSCILLATED DEPENDS ON...","q.3.a0":"ITS COLOUR","q.3.a1":"DISTANCE DIVIDED BY ENERGY","q.3.a2":"THE TEMPERATURE","q.4":"WHY ARE NEUTRINO DETECTORS BUILT DEEP UNDERGROUND?","q.4.a0":"TO BLOCK COSMIC MUONS","q.4.a1":"NEUTRINOS ONLY COME FROM BELOW","q.4.a2":"TO KEEP THEM WARM","q.5":"WHAT MAKES THE ELECTRON NEUTRINOS IN THE SUN?","q.5.a0":"NUCLEAR FUSION","q.5.a1":"SUNLIGHT","q.5.a2":"MAGNETIC STORMS","q.6":"ROUGHLY HOW MANY SOLAR NEUTRINOS CROSS YOUR THUMBNAIL EACH SECOND?","q.6.a0":"ABOUT 10","q.6.a1":"ABOUT A MILLION","q.6.a2":"ABOUT 65 BILLION","q.7":"THE ANTINEUTRINOS OF A NUCLEAR REACTOR COME FROM...","q.7.a0":"BETA DECAYS OF FISSION PRODUCTS","q.7.a1":"THE COOLING TOWERS","q.7.a2":"COSMIC RAYS","q.8":"A SHARP CHERENKOV RING USUALLY MEANS...","q.8.a0":"A MUON","q.8.a1":"AN ELECTRON SHOWER","q.8.a2":"A NEUTRON","q.9":"WHICH OF THESE IS STILL UNKNOWN?","q.9.a0":"IF NEUTRINOS OSCILLATE","q.9.a1":"THE NEUTRINO MASS ORDERING","q.9.a2":"IF NEUTRINOS EXIST","en.spiderling":"BETA ELECTRON","en.spiderling.f":"BETA DECAY: n → p + e⁻ + "+st+"e. THE ELECTRON YOU SEE, THE ANTINEUTRINO YOU DO NOT.","en.spider":"THORIUM-232","en.spider.f":"THORIUM AND URANIUM DECAYING INSIDE THE EARTH MAKE GEONEUTRINOS.","en.cyclops":"EXCITED NUCLEUS","en.cyclops.f":"A NUCLEUS WITH SPARE ENERGY GETS RID OF IT AS A GAMMA RAY.","en.beast":"FAST NEUTRON","en.beast.f":"FAST NEUTRONS CAN FAKE A NEUTRINO SIGNAL. DETECTORS HIDE BEHIND WATER AND ROCK.","en.blob":"URANIUM-235","en.blob.f":"ONE FISSION RELEASES ABOUT 200 MeV AND, THROUGH LATER DECAYS, ABOUT SIX ANTINEUTRINOS.","en.blobling":"FISSION FRAGMENT","en.blobling.f":"FISSION FRAGMENTS HAVE TOO MANY NEUTRONS. THEIR BETA DECAYS MAKE REACTOR ANTINEUTRINOS.","en.bat":"COSMIC MUON","en.bat.f":"ABOUT ONE COSMIC MUON CROSSES YOUR HAND EVERY SECOND.","en.ghost":"DARK NOISE","en.ghost.f":"PHOTOMULTIPLIERS SOMETIMES CLICK WITHOUT ANY LIGHT. THAT IS DARK NOISE.","en.shroom":"POTASSIUM-40","en.shroom.f":"A BANANA HAS ABOUT 15 K-40 DECAYS PER SECOND, YOUR BODY ABOUT 4,000.","en.imp":"SOLAR PLASMA","en.imp.f":"THE SUN'S CORE IS A 15-MILLION-DEGREE SOUP OF BARE NUCLEI AND ELECTRONS.","en.golem":"COSMIC PROTON","en.golem.f":"MOST COSMIC RAYS ARE PROTONS FROM SPACE. THEIR CRASHES IN THE AIR MAKE ATMOSPHERIC NEUTRINOS.","en.bomb":"RADON-222","en.bomb.f":"A RADIOACTIVE GAS THAT SEEPS OUT OF ROCK: A BIG HEADACHE FOR LOW-ENERGY DETECTORS.","en.toad":"TUNNELING ALPHA","en.toad.f":"ALPHA DECAY AND SOLAR FUSION BOTH NEED QUANTUM TUNNELLING THROUGH A BARRIER.","en.snail":"TRITIUM","en.snail.f":"TRITIUM BETA DECAY (HALF-LIFE 12.3 YEARS) IS HOW KATRIN WEIGHS THE NEUTRINO.","en.jelly":"PLASMA BLOB","en.jelly.f":"PLASMA, THE FOURTH STATE OF MATTER: ELECTRONS TORN AWAY FROM THEIR ATOMS.","en.pumpkin":"PION","en.pumpkin.f":"π → μ + νμ: PIONS ARE WHERE ATMOSPHERIC AND BEAM NEUTRINOS COME FROM.","en.cloud":"AIR SHOWER","en.cloud.f":"A SINGLE COSMIC RAY CAN MAKE BILLIONS OF SECONDARY PARTICLES IN THE AIR.","en.worm":"ROCK MUON","en.worm.f":"MUONS MADE BY NEUTRINOS IN THE SURROUNDING ROCK CAN TRAVEL KILOMETRES.","en.beetle":"ALPHA EMITTER","en.beetle.f":"AN ALPHA PARTICLE IS A HELIUM NUCLEUS. A SHEET OF PAPER STOPS IT.","en.owl":"GAMMA RAY","en.owl.f":"A GAMMA RAY IS A PHOTON WITH A MILLION TIMES THE ENERGY OF VISIBLE LIGHT.","en.mimic":"FAKE SIGNAL","en.mimic.f":"NOT EVERY BLIP IS A NEUTRINO. ANALYSES MUST REJECT LOOK-ALIKES.","en.frost":"SOLAR PHOTON","en.frost.f":"LIGHT NEEDS TENS OF THOUSANDS OF YEARS TO STAGGER OUT OF THE SUN. NEUTRINOS NEED TWO SECONDS.","en.moth":"SOLAR WIND","en.moth.f":"THE SUN BLOWS OUT CHARGED PARTICLES AT ABOUT 400 KM PER SECOND.","en.totem":"SPALLATION","en.totem.f":"A FAST MUON CAN SMASH A NUCLEUS. THE PIECES DECAY LATER AND FAKE SIGNALS.","en.fairy":"SYSTEMATIC ERROR","en.fairy.f":"SYSTEMATIC ERRORS DO NOT SHRINK WITH MORE DATA. CAREFUL CALIBRATION FIGHTS THEM.","en.dummy":"TEST TARGET","en.dummy.f":"CALIBRATION SOURCES WITH A KNOWN ENERGY TEACH A DETECTOR WHAT IT SEES.","en.deuteron":"DEUTERON","en.deuteron.f":"THE SUN'S FIRST FUSION STEP: p + p → d + e⁺ + νe. EVERY DEUTERON MADE THERE SENDS OUT ONE OF YOU.","zoo.first.deuteron":"1931: HAROLD UREY FOUND HEAVY HYDROGEN (DEUTERIUM) IN THE SPECTRUM OF HYDROGEN.","en.positron":"POSITRON","en.positron.f":"THE ELECTRON'S ANTIPARTICLE. THE SUN MAKES ONE WITH EVERY DEUTERON, AND REACTOR DETECTORS SPOT ANTINEUTRINOS BY THE POSITRON THEY MAKE.","zoo.first.positron":"1932: CARL ANDERSON SAW IT IN COSMIC RAYS IN A CLOUD CHAMBER (PAUL DIRAC HAD PREDICTED IT IN 1928).","en.gluon":"GLUON","en.gluon.f":"GLUONS CARRY THE STRONG FORCE AND GLUE QUARKS TOGETHER. THEY CARRY COLOUR CHARGE THEMSELVES, SO THEY EVEN STICK TO EACH OTHER.","zoo.first.gluon":"1979: THREE-JET EVENTS AT THE PETRA COLLIDER, DESY, HAMBURG.","en.positronium":"POSITRONIUM","en.positronium.f":"AN ELECTRON AND A POSITRON ORBITING EACH OTHER LIKE A TINY HYDROGEN ATOM, UNTIL THEY ANNIHILATE INTO GAMMA RAYS.","zoo.first.positronium":"1951: MARTIN DEUTSCH, MIT.","en.kaon":"KAON","en.kaon.f":'THE FIRST "STRANGE" PARTICLE. KAONS ALSO SHOWED THE FIRST CP VIOLATION, IN 1964.',"zoo.first.kaon":"1947: GEORGE ROCHESTER AND CLIFFORD BUTLER, COSMIC RAYS IN A CLOUD CHAMBER, MANCHESTER.","en.antiproton":"ANTIPROTON","en.antiproton.f":"A PROTON WITH EVERY CHARGE REVERSED. COSMIC RAYS CARRY A FEW, AND AMS ON THE SPACE STATION COUNTS THEM.","zoo.first.antiproton":"1955: OWEN CHAMBERLAIN AND EMILIO SEGRÈ AT THE BEVATRON, BERKELEY.","en.gwave":"GRAVITATIONAL WAVE","en.gwave.f":"A RIPPLE OF SPACE-TIME FROM COLLIDING BLACK HOLES. IT PASSES THROUGH THE EARTH ALMOST AS EASILY AS YOU DO.","zoo.first.gwave":"2015: LIGO (GW150914), TWO BLACK HOLES MERGING ABOUT 1.3 BILLION LIGHT YEARS AWAY.","en.glashow":"GLASHOW RESONANCE","en.glashow.f":"AN ANTINEUTRINO OF 6.3 PeV HITS AN ELECTRON IN THE ICE AND MAKES A REAL W⁻ BOSON.","zoo.first.glashow":"PREDICTED BY SHELDON GLASHOW IN 1960. ICECUBE SAW ONE (RECORDED 2016, PUBLISHED 2021).","en.jpsi":"J/ψ","en.jpsi.f":"A CHARM QUARK AND ITS ANTIQUARK. TWO LABS FOUND IT IN THE SAME WEEK, SO IT HAS TWO NAMES.","zoo.first.jpsi":'1974: SLAC (BURTON RICHTER) AND BROOKHAVEN (SAMUEL TING), THE "NOVEMBER REVOLUTION".',"en.upsilon":"UPSILON","en.upsilon.f":"A BOTTOM QUARK AND ITS ANTIQUARK: THE FIRST SIGN OF THE THIRD QUARK FAMILY.","zoo.first.up W). NA POTI VEN OSTANE νe LE OKOLI TRETJINA TEBE.","stage.2.name":"DAYA BAY","stage.2.where":"DETEKTORJI REAKTORSKIH ANTINEVTRINOV V VODNEM BAZENU, KITAJSKA","stage.2.body":"JEDRSKI REAKTORJI SO NAJMOČNEJŠI VIRI NEVTRINOV, KI JIH ZGRADIMO: SAMO NEK KRŠKO VSAKO SEKUNDO ODDA OKOLI 4×10²⁰ ELEKTRONSKIH ANTINEVTRINOV. V DAYA BAYU NA KITAJSKEM SO DETEKTORJI STALI V VODNIH BAZENIH 0,5 DO 2 KM OD ŠESTIH REAKTORSKIH SREDIC. SI ELEKTRONSKI ANTINEVTRINO ("+st+"e) S 4 MeV. OPAZUJ MAJHEN HITER UPAD (θ₁₃, ODKRIT TU LETA 2012) IN VELIK POČASEN UPAD (θ₁₂, KAMLAND).","stage.3.name":"OZRAČJE","stage.3.where":"NAD OBSERVATORIJEM PIERRE AUGER, ARGENTINA","stage.3.body":"KOZMIČNI ŽARKI IZ VESOLJA VISOKO NAD TLEMI TREŠČIJO V JEDRA V ZRAKU IN USTVARIJO PLAZOVE PIONOV, KI RAZPADEJO V MIONE IN MIONSKE NEVTRINE. OBSERVATORIJ PIERRE AUGER TAKE PLAZOVE LOVI S 1.660 VODNIMI REZERVOARJI, KOT JE TA, RAZPOREJENIMI NA 3.000 KM². SI νμ Z 1 GeV. V NEKAJ STO KM PRENIHAŠ IZ μ V τ IN NAZAJ: TAKO SO LETA 1998 ODKRILI OSCILACIJE.","stage.4.name":"SKOZI ZEMLJO DO ICECUBA","stage.4.where":"NAVZGOR SKOZI VSO ZEMLJO, V LED JUŽNEGA TEČAJA","stage.4.body":'PRIŠEL SI NAVZGOR SKOZI VSO ZEMLJO, NEDOTAKNJEN, KOT SKORAJ VSAK NEVTRINO. SI νμ S 6 GeV, GOSTA KAMNINA POMAGA νμ, DA SE SPREMENI V νe, A LE, ČE JE VRSTNI RED MAS "NORMALEN". ZDAJ SI V ICECUBU: 5.160 SENZORJEV SVETLOBE NA 86 VRVEH, 1,5 DO 2,5 KM GLOBOKO V ANTARKTIČNEM LEDU. STAVBA NA VRHU JE LABORATORIJ ICECUBE.',"stage.5.name":"SUPER-KAMIOKANDE","stage.5.where":"1 KM POD GORO IKENO, JAPONSKA","stage.5.body":"41 M VISOK JEKLEN REZERVOAR S 50.000 TONAMI ZELO ČISTE VODE, OBDAN Z 11.000 FOTOPOMNOŽEVALKAMI. SI νμ IZ ŽARKA T2K, POSLAN 295 KM SKOZI KAMNINO IZ TOKAIJA, Z 0,6 GeV. TVOJI LEPTONI NA STENAH RIŠEJO OBROČE ČERENKOVE SVETLOBE: OSTRE ZA μ, ZABRISANE ZA e.","stage.real":"PRAVI POSKUSI","stage.0.short":"VAJA","stage.1.short":"SONCE","stage.2.short":"DAYA BAY","stage.3.short":"OZRAČJE","stage.4.short":"ICECUBE","stage.5.short":"SUPER-K","stage.you":"TI","stage ODELIH? ALI NEKAJ NOVEGA?","boss.throneeye.tip":"μ MU NE MORE DO ŽIVEGA. ZADENI GA S τ: TO SO POSTALI MANJKAJOČI νμ.","boss.throneeye.defeat":"1998: SUPER-KAMIOKANDE JE POKAZAL, DA MANJKAJO νμ, KI PRIHAJAJO OD SPODAJ SKOZI ZEMLJO (13.000 KM), TISTI OD ZGORAJ (15 KM) PA NE. PRIMANJKLJAJ JE NATANKO SLEDIL L/E: OSCILACIJE! PRVI DOKAZ, DA IMAJO NEVTRINI MASO. NOBELOVA NAGRADA 2015 (KAJITA).","boss.king.intro":'POZNAMO RAZLIKE KVADRATOV NEVTRINSKIH MAS, NE PA NJIHOVEGA VRSTNEGA REDA. JE ν₃ NAJTEŽJI ("NORMALNO") ALI NAJLAŽJI ("OBRNJENO")?',"boss.king.tip":"OBRAČA SVOJ VRSTNI RED. NORMALNO: ŠIBEK NA e. OBRNJENO: ŠIBEK NA μ.","boss.king.defeat":"ŠE VEDNO ODPRTO VPRAŠANJE! JUNO (KITAJSKA), DUNE (ZDA), HYPER-KAMIOKANDE (JAPONSKA), ICECUBE IN KM3NET/ORCA V SREDOZEMLJU ISKAJO ODGOVOR. SNOV V ZEMLJI OKREPI νμ→νe LE PRI ENEM OD OBEH VRSTNIH REDOV.","boss.brood.intro":"FAZA δCP BI LAHKO POVZROČILA, DA NEVTRINI IN ANTINEVTRINI OSCILIRAJO RAZLIČNO. TO BI LAHKO POMAGALO RAZLOŽITI, ZAKAJ JE VESOLJE IZ SNOVI IN NE IZ ANTISNOVI.","boss.brood.tip":"NJEGOVA ŠIBKOST SE VRTI Z KAZALCEM. NA POL POTI TE ŽAREK SPREMENI V ANTINEVTRINO.","boss.brood.defeat":"ŠE ODPRTO! T2K IN NOVA VIDITA NAMIGE. DUNE IN HYPER-KAMIOKANDE, KI ZAČNETA KONEC 2020-IH, CILJATA NA ODKRITJE. MORDA BOŠ V EKIPI TUDI TI.","boss.history":"ZGODOVINA","boss.tip":"KAKO GA PREMAGAŠ","boss.solved":"REŠENO","boss.open":"ŠE ODPRTO","pop.throw0.t":"ELEKTRON!","pop.throw0.b":'TVOJ νe JE ZADEL JEDRO IN SE Z IZMENJAVO BOZONA W ("NABITI TOK") SPREMENIL V ELEKTRON. LAHEK ELEKTRON SE VELIKO SIPA IN USTVARI PLAZ DELCEV: NJEGOV ČERENKOV STOŽEC JE ZABRISAN IN POLN, NA STENI PA NASTANE MEGLEN OBROČ.',"pop.throw1.t":"MION!","pop.throw1.b":"MION JE 200-KRAT TEŽJI OD ELEKTRONA. LETI NARAVNOST IN DALEČ, PREBODE VSE NA SVOJI POTI. NJEGOV ČERENKOV STOŽEC JE OSTER IN VOTEL: KO SE SLED KONČA, SVETLOBA LETI NAPREJ KOT OBROČ Z LUKNJO NA SREDINI.","pop.throw2.t":"TAUON!","pop.throw2.b":'TAUON JE 3.500-KRAT TEŽJI OD ELEKTRONA IN RAZPADE SKORAJ TAKOJ: EN POK, KJER NASTANE, DRUGI, KJER RAZPADE. ICECUBE IŠČE TAKŠNE "DVOJNE POKE".',"pop.dice.t":"KVANTNA KOCKA","pop.dice.b":"KATERI LEPTON VRŽEŠ, ODLOČI NAKLJUČJE. STOLPCI KAŽEJO VERJETNOSTI: 70% μ POMENI, DA JE SEDEM OD DESETIH METOV MIONOV. KVANTNA MEHANIKA DA LE VERJETNOSTI.","pop.cherenkov.t":"ČERENKOVA SVETLOBA","pop.cherenkov.b":"V VODI SVETLOBA POTUJE LE S 75% SVOJE HITROSTI V VAKUUMU. NABIT DELEC, KI JE HITREJŠI, ZA SABO PUSTI STOŽEC MODRE SVETLOBE, KOT ZVOČNI POK LETALA: cos θ = 1/(nβ), V VODI 41°.","pop.osc.t":"SPREMENIL SI OKUS!","pop.osc.b":"NEVTRINO JE MEŠANICA TREH MASNIH STANJ ν₁, ν₂, ν₃. POTUJEJO Z MALO RAZLIČNIMI RITMI, ZATO SE MEŠANICA IN S TEM TVOJ OKUS SPREMINJATA Z RAZDALJO / ENERGIJO (L/E). TO JE MOGOČE LE, ČE IMAJO NEVTRINI MASO.","pop.pass.t":"ŠLO JE SKOZI TEBE","pop.pass.b":"NEVTRINI SKORAJ NIKOLI NE INTERAGIRAJO. SVETLOBNO LETO SVINCA BI USTAVILO LE OKOLI POLOVICO SONČEVIH NEVTRINOV. TU GRE SKOZI TEBE OKOLI POLOVICA VSEH ZADETKOV.","pop.nc.t":"NEVTRALNI TOK","pop.nc.b":"Z BOZONOM Z SE NEVTRINO LAHKO ZALETI V SNOV, NE DA BI POSTAL NABIT LEPTON. ZA VSE OKUSE DELUJE ENAKO, ZATO NE POZNA ŠIBKOSTI. SNO JE Z NJIM PREŠTEL VSE SONČEVE NEVTRINE.","pop.w.t":"BOZON W: SI NABIT LEPTON","pop.w.b":"KO NEVTRINO ABSORBIRA W, POSTANE SVOJ NABITI PARTNER. NABITI DELCI ČUTIJO ELEKTRIČNE SILE: NIČ VEČ NE GRE SKOZI TEBE, A ZADENEŠ MOČNEJE IN SIJEŠ ČERENKOVO SVETLOBO. TEŽKI LEPTONI NE ŽIVIJO DOLGO...","pop.wend.0.t":"ZAJETJE ELEKTRONA","pop.wend.0.b":"ELEKTRONI SO STABILNI. TU TE ZAJAME PROTON (e + p → n + νe) IN SPET SI νe.","pop.wend.1.t":"RAZPAD MIONA","pop.wend.1.b":"MION ŽIVI 2,2 MIKROSEKUNDE, NATO RAZPADE: μ → e + "+st+"e + νμ. SPET SI νμ.","pop.wend.2.t":"RAZPAD TAUONA","pop.wend.2.b":'TAUON ŽIVI 0,3 PIKOSEKUNDE. PRI RAZPADU VEDNO NASTANE ντ ("OBNOVA TAUONA"): SPET SI ντ.',"pop.msw.t":"UČINEK MSW","pop.msw.b":"ELEKTRONSKI NEVTRINI SE SIPAJO TUDI NA SONČEVIH ELEKTRONIH. TA DODATNI POTISK SPREMENI MEŠANJE. KJER JE GOSTOTA RAVNO PRAVA, SE νe GLADKO SPREMENI V ν₂, ν₂ PA ZAPUSTI SONCE KOT PRIBLIŽNO 1/3 νe IN 2/3 νμ + ντ.","pop.anti.t":"ANTINEVTRINI","pop.anti.b":"REAKTORJI USTVARJAJO ELEKTRONSKE ANTINEVTRINE ("+st+'e), ANTISNOVNE DVOJČKE νe. OSCILIRAJO ENAKO, RAZEN FAZE CP. ČRTICA NAD ν POMENI "ANTI".',"pop.flip.t":"NEVTRINO ALI ANTINEVTRINO?","pop.flip.b":"POSKUSI Z ŽARKI OBRNEJO TOK V MAGNETNIH ROGOVIH IN DOBIJO "+st+"μ NAMESTO νμ. ČE OBOJI OSCILIRAJO RAZLIČNO, JE SIMETRIJA CP KRŠENA. ZDAJ SI "+st+"μ!","pop.evidence.t":"3σ: MOČAN NAMIG","pop.evidence.b":"ZNAČILNOST RASTE S KVADRATNIM KORENOM ŠTEVILA DOGODKOV: ŠTIRIKRAT VEČ PODATKOV DA DVAKRAT VEČ σ. PRI 3σ BI BIL NAKLJUČEN ODKLON TAKO VELIK LE V 0,3% PRIMEROV. TO ŠE NI ODKRITJE.","pop.discovery.t":"5σ: ODKRITJE!","pop.discovery.b":"PRI 5σ JE MOŽNOST NAKLJUČJA MANJ KOT 1 PROTI 3,5 MILIJONA. TO JE PRAVILO ZA ODKRITJE V FIZIKI DELCEV, UPORABLJENO ZA OSCILACIJE IN ZA HIGGSOV BOZON.","pop.arcade.t":"ARKADNI NAČIN","pop.arcade.b":"V ARKADNEM NAČINU VSAK IZMIK PREPROSTO PREKLOPI e → μ → τ. PRAVI NEVTRINI SE SPREMINJAJO GLADKO: POSKUSI NAČIN PRAVIH OSCILACIJ.","pop.more":"VEČ V FIZIKALNEM PRIROČNIKU (MENI PREMOR)","tut.move":"PREMIKAJ SE Z A / D (ALI ← →)","tut.jump":"SKOČI Z W, ↑ ALI PRESLEDNICO. DRŽI ZA VIŠJE SKOKE. S ALI ↓ TE SPUSTI SKOZI PLOŠČAD.","tut.throw":"MERI Z MIŠKO: MERILNI KRIŽ POKAŽE, KAM LETI LEPTON. LEVI KLIK ALI E VRŽE; DRŽI ZA NEPREKINJENO METANJE.","tut.bars":"SPODAJ: TVOJA MEŠANICA OKUSOV. ORANŽNA e, ŠKRLATNA μ, VIJOLIČNA τ. VSAK MET JE ŽREB S TEMI VERJETNOSTMI.","tut.travel":"ZDAJ SE SPREHODI IN OPAZUJ STOLPCE: POTOVANJE SPREMINJA TVOJ OKUS. TO SO OSCILACIJE!","tut.dodge":"IZMAKNI SE S SHIFT (ALI K) V SMER, KAMOR HODIŠ. IZMIK JE HITER SKOK V RAZDALJI: OBRNE μ ↔ τ.","tut.weak":"ČRKA NAD TARČO JE NJEN ŠIBKI OKUS (×2, OSTALI ×0,6). STOJ PRI MIRU, DA OHRANIŠ OKUS, PREMIKAJ SE, DA GA SPREMENIŠ.","tut.nc":"Z-SUNEK: DESNI GUMB MIŠKE, Z ALI Q. ZADENE VSE BLIZU, NE GLEDE NA OKUS. TRAK SPODAJ POKAŽE, KDAJ JE SPET PRIPRAVLJEN.","tut.w":"BOZON W! DOTAKNI SE GA IN ZA NEKAJ 80 KM.","codex.4.t":"SNOV IN UČINEK MSW","codex.4.b":"V SNOVI SE νe PREK BOZONA W SIPA TUDI NA ELEKTRONIH. TA DODATNA ENERGIJA SPREMENI MEŠANJE (MIHEJEV, SMIRNOV, WOLFENSTEIN). V SONCU SPREMENI VISOKOENERGIJSKE νe V ν₂. V ZEMLJI OKREPI νμ → νe ZA EN VRSTNI RED MAS IN "+st+"μ → "+st+"e ZA DRUGEGA.","codex.5.t":"ČERENKOVA SVETLOBA","codex.5.b":"NABIT DELEC, HITREJŠI OD SVETLOBE V SNOVI (c/n), SEVA SVETLOBO NA STOŽCU: cos θ = 1/(nβ). VODA, n = 1,33: 41°. ZRAK, n = 1,0003: 1,4°. FOTOPOMNOŽEVALKE NA STENAH VIDIJO OBROČ: OSTER IN Z LUKNJO NA SREDINI ZA DOLGO SLED MIONA, ZABRISAN IN POLN ZA ELEKTRONSKI PLAZ. TAKO SUPER-K LOČI νμ OD νe. PAVEL ČERENKOV, NOBELOVA NAGRADA 1958.","codex.6.t":"KAKO UJETI NEULOVLJIVO","codex.6.b":"VELIKO: SUPER-K IMA 50.000 TON VODE, ICECUBE KUBIČNI KILOMETER ANTARKTIČNEGA LEDU. GLOBOKO: KILOMETER KAMNINE USTAVI VEČINO KOZMIČNIH MIONOV. ČISTO: RADON, KALIJ-40, URAN IN TORIJ DAJEJO LAŽNE SIGNALE. PA VSE ENO SUPER-K VIDI LE NEKAJ DESET SONČEVIH NEVTRINOV NA DAN, ČEPRAV GA VSAKO SEKUNDO PREČKA MILIJARDA MILIJARD.","codex.7.t":"ODPRTA VPRAŠANJA","codex.7.b":"KOLIKO TEHTAJO NEVTRINI? (KATRIN: MANJ KOT 0,45 eV.) KATERI JE NAJTEŽJI (VRSTNI RED MAS)? ALI NEVTRINI IN ANTINEVTRINI OSCILIRAJO RAZLIČNO (KRŠITEV CP)? JE NEVTRINO SAM SVOJ ANTIDELEC (MAJORANA)? NASLEDNJA GENERACIJA POSKUSOV NASTAJA PRAV ZDAJ.","q.0":"NEVTRINO NASTANE KOT νμ. DALEČ STRAN GA LAHKO ZAZNAMO KOT...","q.0.a0":"LE νμ","q.0.a1":"νe, νμ ALI ντ","q.0.a2":"FOTON","q.1":"OSCILACIJE NEVTRINOV KAŽEJO, DA NEVTRINI...","q.1.a0":"IMAJO MASO","q.1.a1":"IMAJO ELEKTRIČNI NABOJ","q.1.a2":"SO HITREJŠI OD SVETLOBE","q.2":"KAJ PRAVZAPRAV VIDI VODNI DETEKTOR, KOT JE SUPER-K?","q.2.a0":"SAM NEVTRINO","q.2.a1":"SVETLOBO NABITIH DELCEV","q.2.a2":"ZVOČNE VALOVE V VODI","q.3":"KOLIKO JE NEVTRINO OSCILIRAL, JE ODVISNO OD...","q.3.a0":"NJEGOVE BARVE","q.3.a1":"RAZDALJE, DELJENE Z ENERGIJO","q.3.a2":"TEMPERATURE","q.4":"ZAKAJ GRADIJO NEVTRINSKE DETEKTORJE GLOBOKO POD ZEMLJO?","q.4.a0":"DA USTAVIJO KOZMIČNE MIO
