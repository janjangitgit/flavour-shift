 μ TO τ AND BACK: THIS IS HOW OSCILLATION WAS DISCOVERED IN 1998.","stage.4.name":"THROUGH THE EARTH TO ICECUBE","stage.4.where":"UP THROUGH THE WHOLE EARTH, INTO THE SOUTH POLE ICE","stage.4.body":'YOU CAME UP THROUGH THE WHOLE EARTH, AS ALMOST EVERY NEUTRINO DOES, UNTOUCHED. YOU ARE A νμ WITH 6 GeV, AND THE DENSE ROCK HELPS νμ TURN INTO νe, BUT ONLY IF THE MASS ORDERING IS "NORMAL". NOW YOU ARE IN ICECUBE: 5,160 LIGHT SENSORS ON 86 STRINGS, 1.5 TO 2.5 KM DEEP IN THE ANTARCTIC ICE. THE BUILDING ON TOP IS THE ICECUBE LAB.',"stage.5.name":"SUPER-KAMIOKANDE","stage.5.where":"1 KM UNDER MOUNT IKENO, JAPAN","stage.5.body":"A STEEL TANK 41 M TALL WITH 50,000 TONNES OF ULTRA-PURE WATER, LINED WITH 11,000 PHOTOMULTIPLIERS. YOU ARE A νμ FROM THE T2K BEAM, SENT 295 KM THROUGH THE ROCK FROM TOKAI, WITH 0.6 GeV. YOUR LEPTONS DRAW RINGS OF CHERENKOV LIGHT ON THE WALLS: SHARP FOR μ, FUZZY FOR e.","stage.real":"REAL EXPERIMENTS","stage.0.short":"TRAINING","stage.1.short":"THE SUN","stage.2.short":"DAYA BAY","stage.3.short":"ATMOSPHERE","stage.4.short":"ICECUBE","stage.5.short":"SUPER-K","stage.0.real":"TRIGA RESEARCH REACTORS, E.G. JSI LJUBLJANA","stage.1.real":"HOMESTAKE, SUPER-K, SNO, BOREXINO","stage.2.real":"DAYA BAY, RENO, DOUBLE CHOOZ, KAMLAND, JUNO","stage.3.real":"PIERRE AUGER (COSMIC RAYS), SUPER-K, ICECUBE","stage.4.real":"ICECUBE, KM3NET/ORCA, SUPER-K","stage.5.real":"SUPER-K AND T2K, HYPER-K, NOVA, DUNE","stage.you":"YOU","stage.energy":"ENERGY","stage.matter":"MATTER","stage.medium":"LIGHT HERE","medium.water":"WATER: CHERENKOV CONE 41°","medium.plasma":"PLASMA: NO CHERENKOV LIGHT (n < 1), AND OPAQUE","medium.air":"AIR: A NARROW 1.4° CONE","medium.rock":"ROCK: OPAQUE","medium.ice":"ICE: CHERENKOV CONE 40°","sun.core":"CORE · 15 MILLION °C","sun.rad":"RADIATIVE ZONE","sun.rad.sub":"LIGHT ZIGZAGS OUT","sun.conv":"CONVECTION ZONE","sun.surf":"SURFACE · 5500 °C","sun.corona":"CORONA · MILLIONS OF °C","photo.juno":"PICTURE: THE JUNO DETECTOR, CHINA","photo.core":"PICTURE: A RESEARCH REACTOR CORE","matter.0":"NONE TO SPEAK OF","matter.1":"VERY DENSE, THINNING OUT (MSW)","matter.2":"WATER (TOO LITTLE TO MATTER)","matter.3":"THIN AIR","matter.4":"THE WHOLE EARTH (MATTER EFFECT)","matter.5":"WATER (TOO LITTLE TO MATTER)","boss.blobqueen.intro":"1968: RAY DAVIS COUNTED SOLAR νe WITH 615 TONNES OF CLEANING FLUID DEEP IN THE HOMESTAKE MINE. HE FOUND ONLY ABOUT ONE THIRD OF WHAT THE SUN SHOULD MAKE. FOR 30 YEARS NOBODY KNEW WHERE THE REST WENT.","boss.blobqueen.tip":"WEAK TO μ AND τ. YOUR Z PULSE (RIGHT CLICK) SEES ALL FLAVOURS: IT HITS ×3.","boss.blobqueen.defeat":"2001-2002: SNO IN CANADA USED HEAVY WATER TO COUNT ONLY νe (CHARGED CURRENT) AND ALL FLAVOURS AT ONCE (NEUTRAL CURRENT). ALL FLAVOURS TOGETHER GAVE THE FULL SOLAR FLUX: NOTHING WAS MISSING, THE νe HAD CHANGED INTO νμ AND ντ. NOBEL PRIZES 2002 (DAVIS, KOSHIBA) AND 2015 (McDONALD).","boss.warden.intro":"THREE MIXING ANGLES SAY HOW FLAVOURS AND MASS STATES MIX. θ₁₂ AND θ₂₃ ARE LARGE. THE THIRD, θ₁₃, WAS SO SMALL THAT IT STAYED HIDDEN UNTIL 2012.","boss.warden.tip":"WEAK TO μ AND τ: THE FEW ANTINEUTRINOS THAT STOP BEING e.","boss.warden.defeat":"2012: DAYA BAY (CHINA), RENO (KOREA) AND DOUBLE CHOOZ (FRANCE) SAW ABOUT 6% OF REACTOR ANTINEUTRINOS VANISH AFTER 1-2 KM: θ₁₃ ≈ 8.6°. SMALL, BUT NOT ZERO, AND THAT MAKES THE SEARCH FOR CP VIOLATION POSSIBLE.","boss.throneeye.intro":"IN THE 1980S AND 90S, DETECTORS COUNTED TOO FEW MUON NEUTRINOS FROM THE ATMOSPHERE. A MISTAKE IN THE MODELS? OR SOMETHING NEW?","boss.throneeye.tip":"IT SHRUGS OFF μ. HIT IT WITH τ: THAT IS WHAT THE MISSING νμ BECAME.","boss.throneeye.defeat":"1998: SUPER-KAMIOKANDE SHOWED THAT νμ COMING UP THROUGH THE EARTH (13,000 KM) WERE MISSING, WHILE THOSE FROM ABOVE (15 KM) WERE NOT. THE DEFICIT FOLLOWED L/E EXACTLY: OSCILLATION! THE FIRST PROOF THAT NEUTRINOS HAVE MASS. NOBEL PRIZE 2015 (KAJITA).","boss.king.intro":'WE KNOW THE DIFFERENCES OF THE SQUARED NEUTRINO MASSES, BUT NOT THEIR ORDER. IS ν₃ THE HEAVIEST ("NORMAL") OR THE LIGHTEST ("INVERTED")?',"boss.king.tip":"IT FLIPS ITS ORDER. NORMAL: WEAK TO e. INVERTED: WEAK TO μ.","boss.king.defeat":"STILL AN OPEN QUESTION! JUNO (CHINA), DUNE (USA), HYPER-KAMIOKANDE (JAPAN), ICECUBE AND KM3NET/ORCA IN THE MEDITERRANEAN ARE ON IT. MATTER IN THE EARTH BOOSTS νμ→νe ONLY FOR ONE OF THE TWO ORDERINGS.","boss.brood.intro":"THE PHASE δCP COULD MAKE NEUTRINOS AND ANTINEUTRINOS OSCILLATE DIFFERENTLY. THAT COULD HELP EXPLAIN WHY THE UNIVERSE IS MADE OF MATTER AND NOT ANTIMATTER.","boss.brood.tip":"ITS WEAKNESS TURNS WITH THE NEEDLE. HALFWAY, THE BEAM FLIPS YOU INTO AN ANTINEUTRINO.","boss.brood.defeat":"STILL OPEN! T2K AND NOVA SEE HINTS. DUNE AND HYPER-KAMIOKANDE, STARTING IN THE LATE 2020S, AIM FOR A DISCOVERY. MAYBE YOU WILL BE ON THE TEAM.","boss.history":"HISTORY","boss.tip":"HOW TO BEAT IT","boss.solved":"SOLVED","boss.open":"STILL OPEN","pop.throw0.t":"ELECTRON!","pop.throw0.b":'YOUR νe HIT A NUCLEUS AND TURNED INTO AN ELECTRON BY SWAPPING A W BOSON (A "CHARGED CURRENT"). A LIGHT ELECTRON SCATTERS A LOT AND MAKES A SHOWER: ITS CHERENKOV CONE IS FUZZY AND FILLED, AND ON THE WALL IT MAKES A BLURRED RING.',"pop.throw1.t":"MUON!","pop.throw1.b":"THE MUON IS 200 TIMES HEAVIER THAN THE ELECTRON. IT FLIES STRAIGHT AND FAR, PIERCING EVERYTHING IN ITS WAY. ITS CHERENKOV CONE IS SHARP AND HOLLOW: WHEN THE TRACK ENDS, THE LIGHT FLIES ON AS A RING WITH A HOLE IN THE MIDDLE.","pop.throw2.t":"TAU!","pop.throw2.b":'THE TAU IS 3,500 TIMES HEAVIER THAN THE ELECTRON AND DECAYS ALMOST AT ONCE: ONE BANG WHERE IT IS MADE, A SECOND WHERE IT DECAYS. ICECUBE SEARCHES FOR SUCH "DOUBLE BANGS".',"pop.dice.t":"QUANTUM DICE","pop.dice.b":"WHICH LEPTON YOU THROW IS DECIDED BY CHANCE. THE BARS SHOW THE ODDS: 70% μ MEANS SEVEN THROWS IN TEN ARE MUONS. QUANTUM MECHANICS ONLY GIVES PROBABILITIES.","pop.cherenkov.t":"CHERENKOV LIGHT","pop.cherenkov.b":"IN WATER, LIGHT TRAVELS AT ONLY 75% OF ITS VACUUM SPEED. A CHARGED PARTICLE FASTER THAN THAT LEAVES A CONE OF BLUE LIGHT BEHIND, LIKE THE SONIC BOOM OF A JET: cos θ = 1/(nβ), 41° IN WATER.","pop.osc.t":"YOU CHANGED FLAVOUR!","pop.osc.b":"A NEUTRINO IS A MIX OF THREE MASS STATES ν₁, ν₂, ν₃. THEY TRAVEL WITH SLIGHTLY DIFFERENT RHYTHMS, SO THE MIX, AND YOUR FLAVOUR, DRIFTS WITH DISTANCE / ENERGY (L/E). THIS IS ONLY POSSIBLE IF NEUTRINOS HAVE MASS.","pop.pass.t":"IT WENT RIGHT THROUGH YOU","pop.pass.b":"NEUTRINOS HARDLY EVER INTERACT. A LIGHT-YEAR OF LEAD WOULD STOP ONLY ABOUT HALF OF THE NEUTRINOS FROM THE SUN. HERE ABOUT HALF OF ALL HITS PASS THROUGH YOU.","pop.nc.t":"NEUTRAL CURRENT","pop.nc.b":"WITH A Z BOSON A NEUTRINO CAN BUMP INTO MATTER WITHOUT TURNING INTO A CHARGED LEPTON. IT WORKS THE SAME FOR ALL FLAVOURS, SO IT IGNORES WEAKNESSES. SNO USED IT TO COUNT ALL SOLAR NEUTRINOS.","pop.w.t":"W BOSON: YOU ARE A CHARGED LEPTON","pop.w.b":"ABSORBING A W TURNS A NEUTRINO INTO ITS CHARGED PARTNER. CHARGED PARTICLES FEEL ELECTRIC FORCES: NOTHING PASSES THROUGH YOU NOW, BUT YOU HIT HARDER AND SHINE CHERENKOV LIGHT. HEAVY LEPTONS DO NOT LAST LONG...","pop.wend.0.t":"ELECTRON CAPTURE","pop.wend.0.b":"ELECTRONS ARE STABLE. HERE A PROTON CAPTURES YOU (e + p → n + νe), AND YOU ARE A νe AGAIN.","pop.wend.1.t":"MUON DECAY","pop.wend.1.b":"A MUON LIVES 2.2 MICROSECONDS, THEN DECAYS: μ → e + "+ot+"e + νμ. YOU ARE A νμ AGAIN.","pop.wend.2.t":"TAU DECAY","pop.wend.2.b":'A TAU LIVES 0.3 PICOSECONDS. ITS DECAY ALWAYS MAKES A ντ ("TAU REGENERATION"): YOU ARE A ντ AGAIN.',"pop.msw.t":"THE MSW EFFECT","pop.msw.b":"ELECTRON NEUTRINOS ALSO SCATTER OFF THE ELECTRONS OF THE SUN. THIS EXTRA PUSH CHANGES THE MIXING. WHERE THE DENSITY IS JUST RIGHT, νe TURNS SMOOTHLY INTO ν₂, AND ν₂ LEAVES THE SUN AS ABOUT 1/3 νe AND 2/3 νμ + ντ.","pop.anti.t":"ANTINEUTRINOS","pop.anti.b":"REACTORS MAKE ELECTRON ANTINEUTRINOS ("+ot+'e), THE ANTIMATTER TWINS OF νe. THEY OSCILLATE THE SAME WAY, EXCEPT FOR THE CP PHASE. THE BAR OVER THE ν MEANS "ANTI".',"pop.flip.t":"NEUTRINO OR ANTINEUTRINO?","pop.flip.b":"BEAM EXPERIMENTS FLIP THE CURRENT IN THEIR MAGNETIC HORNS TO MAKE "+ot+"μ INSTEAD OF νμ. IF THE TWO OSCILLATE DIFFERENTLY, CP SYMMETRY IS BROKEN. YOU ARE NOW A "+ot+"μ!","pop.evidence.t":"3σ: EVIDENCE","pop.evidence.b":'SIGNIFICANCE GROWS LIKE THE SQUARE ROOT OF YOUR EVENTS: FOUR TIMES MORE DATA GIVES TWICE THE σ. AT 3σ A RANDOM FLUKE WOULD BE THIS BIG ONLY 0.3% OF THE TIME. PHYSICISTS CALL IT "EVIDENCE", NOT YET A DISCOVERY.',"pop.discovery.t":"5σ: DISCOVERY!","pop.discovery.b":"AT 5σ THE CHANCE OF A FLUKE IS BELOW 1 IN 3.5 MILLION. THAT IS THE RULE FOR CLAIMING A DISCOVERY IN PARTICLE PHYSICS, USED FOR OSCILLATIONS AND FOR THE HIGGS BOSON.","pop.arcade.t":"ARCADE MODE","pop.arcade.b":"IN ARCADE MODE EVERY DODGE SIMPLY SWITCHES e → μ → τ. REAL NEUTRINOS DRIFT SMOOTHLY: TRY THE REAL OSCILLATION MODE IN SETTINGS.","pop.more":"MORE IN THE PHYSICS CODEX (PAUSE MENU)","tut.move":"MOVE WITH A / D (OR ← →)","tut.jump":"JUMP WITH W, ↑ OR SPACE. HOLD IT TO KEEP JUMPING HIGHER. S OR ↓ DROPS THROUGH A PLATFORM.","tut.throw":"AIM WITH THE MOUSE: THE CROSSHAIR SHOWS WHERE THE LEPTON GOES. LEFT CLICK OR E THROWS; HOLD IT TO KEEP THROWING.","tut.bars":"BELOW: YOUR FLAVOUR MIX. ORANGE e, MAGENTA μ, VIOLET τ. EACH THROW IS ROLLED FROM THESE ODDS.","tut.travel":"NOW WALK AROUND AND WATCH THE BARS: TRAVELLING CHANGES YOUR FLAVOUR. THAT IS OSCILLATION!","tut.dodge":"DODGE WITH SHIFT (OR K) IN THE DIRECTION YOU ARE WALKING. A DODGE IS A QUICK HOP IN DISTANCE: IT FLIPS μ ↔ τ.","tut.weak":"THE LETTER ABOVE A TARGET IS ITS WEAK FLAVOUR (×2, OTHERS ×0.6). STAND STILL TO KEEP YOUR FLAVOUR, MOVE TO CHANGE IT.","tut.nc":"Z PULSE: RIGHT MOUSE BUTTON, Z OR Q. IT HITS EVERYTHING NEARBY, WHATEVER THE FLAVOUR. THE BAR BELOW SHOWS WHEN IT IS READY AGAIN.","tut.w":"A W BOSON! TOUCH IT TO BECOME A CHARGED LEPTON FOR A FEW SECONDS.","tut.wave":"LAST TEST: SURVIVE A SHOWER OF COSMIC MUONS!","tut.done":"TRAINING COMPLETE!","tut.skip":"TAB: SKIP STEP","tut.step":"TRAINING {n}/{of}","cr.title":"CONTROL ROOM","cr.cleared":"STAGE {n} CLEARED","cr.events":"EVENTS","cr.time":"TIME","cr.data":"DATA EARNED","cr.throws":"LEPTONS THROWN","cr.cards":"CARD SHOP","cr.quiz":"QUIZ BONUS","cr.repair":"REPAIR +8 HP ({p} DATA)","cr.next":"NEXT STAGE","cr.buy":"BUY","cr.sold":"SOLD","cr.reroll":"NEW CARDS {n}","cr.nodata":"NOT ENOUGH DATA","cr.full":"ALREADY AT FULL HP","cr.tap":"CLICK A CARD TO READ IT","cr.right":"CORRECT! +{n} DATA","cr.wrong":"NOT QUITE. THE ANSWER: {a}","cr.answered":"QUIZ DONE FOR THIS STAGE","cr.healed":"THE CREW PATCHED YOU UP +{n}","cr.upnext":"NEXT","res.win":"JOURNEY COMPLETE!","res.lose":"ABSORBED","res.score":"SCORE","res.stage":"STAGE REACHED","res.events":"EVENTS","res.sigma":"SIGNIFICANCE","res.time":"TIME","res.throws":"e / μ / τ THROWN","res.again":"PLAY AGAIN","res.retry":"RETRY STAGE {n}","res.retry.hint":"RETRY KEEPS YOUR CARDS AND DATA FROM THE START OF THE STAGE (ENTER)","res.title":"TITLE","res.new":"NEW HIGH SCORE! TYPE YOUR INITIALS","res.enter":"ENTER TO SAVE","res.top":"TOP 10","res.empty":"NO SCORES YET","quiz.pre":"QUICK QUIZ: WHAT DO YOU THINK?","quiz.post":"AND NOW?","quiz.pre.sub":"THREE QUESTIONS. NO WRONG GUESSES, IT HELPS US SEE WHAT YOU LEARN.","quiz.post.sub":"THE SAME THREE QUESTIONS AGAIN.","quiz.n":"QUESTION {n}/{of}","quiz.keys":"CLICK OR PRESS 1 / 2 / 3","quiz.thanks":"THANKS!","quiz.score":"BEFORE: {a}/3   AFTER: {b}/3","debrief.title":"WHAT YOU JUST DID","debrief.1":"NEUTRINOS COME IN THREE FLAVOURS AND CHANGE FLAVOUR AS THEY TRAVEL. HOW MUCH DEPENDS ON DISTANCE / ENERGY (L/E).","debrief.2":"OSCILLATION MEANS NEUTRINOS HAVE MASS, EVEN THOUGH THE STANDARD MODEL HAD ASSUMED ZERO. NOBEL PRIZE 2015.","debrief.3":"WE SEE THEM ONLY THROUGH THE CHARGED LEPTONS THEY MAKE, AS CHERENKOV RINGS IN HUGE, DEEP, CLEAN DETECTORS. THE MASS ORDERING AND CP VIOLATION ARE STILL OPEN!","debrief.qr":"READ MORE:","debrief.url":"EN.WIKIPEDIA.ORG/WIKI/NEUTRINO_OSCILLATION","teacher.title":"TEACHER STATS (THIS COMPUTER ONLY)","teacher.runs":"RUNS STARTED","teacher.wins":"JOURNEYS COMPLETED","teacher.stage":"AVERAGE STAGE REACHED","teacher.pre":"PRE-QUIZ CORRECT","teacher.post":"POST-QUIZ CORRECT","teacher.q":"Q{n}","teacher.reset":"RESET STATS","teacher.note":"ANONYMOUS COUNTS ONLY. NOTHING LEAVES THIS BROWSER.","teacher.sure":"CLICK AGAIN TO RESET","codex.n":"PAGE {n}/{of}","codex.0.t":"WHAT IS A NEUTRINO?","codex.0.b":"AN ELEMENTARY PARTICLE WITH NO ELECTRIC CHARGE AND A TINY MASS. IT FEELS ONLY THE WEAK FORCE AND GRAVITY, SO IT PASSES THROUGH ALMOST ANYTHING. WOLFGANG PAULI PROPOSED IT IN 1930 TO SAVE ENERGY CONSERVATION IN BETA DECAY. COWAN AND REINES FIRST CAUGHT IT AT A NUCLEAR REACTOR IN 1956. NEUTRINOS ARE THE MOST NUMEROUS MATTER PARTICLES IN THE UNIVERSE.","codex.1.t":"THREE FLAVOURS","codex.1.b":'ELECTRON, MUON AND TAU NEUTRINOS (νe, νμ, ντ). THE FLAVOUR IS THE CHARGED LEPTON A NEUTRINO IS MADE WITH, OR MAKES WHEN IT HITS SOMETHING THROUGH A W BOSON ("CHARGED CURRENT"): e (0.511 MeV), μ (106 MeV) OR τ (1777 MeV). WITH A Z BOSON ("NEUTRAL CURRENT") ALL FLAVOURS BEHAVE THE SAME. BETA DECAYS IN REACTORS MAKE ANTINEUTRINOS ('+ot+"e).","codex.2.t":"OSCILLATION","codex.2.b":"EACH FLAVOUR IS A QUANTUM MIX OF THREE MASS STATES ν₁, ν₂, ν₃, DESCRIBED BY THE PMNS MATRIX (THREE ANGLES AND ONE PHASE). THE MASS STATES TRAVEL WITH SLIGHTLY DIFFERENT PHASES, SO THE MIX CHANGES ALONG THE WAY. FOR TWO FLAVOURS: P = sin²2θ · sin²(1.27 Δm² L/E), WITH Δm² IN eV², L IN KM, E IN GeV. NO MASS DIFFERENCE, NO OSCILLATION.","codex.3.t":"THE NUMBERS IN THIS GAME","codex.3.b":"sin²θ₁₂ = 0.307   sin²θ₂₃ = 0.546   sin²θ₁₃ = 0.022   δCP ≈ 1.36π   Δm²₂₁ = 7.5×10⁻⁵ eV²   Δm²₃₂ = 2.45×10⁻³ eV² (NORMAL ORDERING, PARTICLE DATA GROUP). THE GAME SOLVES THE FULL THREE-FLAVOUR EQUATION, WITH MATTER, EVERY FRAME. ONLY DISTANCES ARE SQUEEZED SO THAT AN OSCILLATION FITS ON SCREEN: AT 1 GeV, 200 PIXELS STAND FOR 980 KM.","codex.4.t":"MATTER AND THE MSW EFFECT","codex.4.b":"INSIDE MATTER, νe ALSO SCATTERS OFF ELECTRONS THROUGH THE W BOSON. THIS EXTRA ENERGY CHANGES THE MIXING (MIKHEYEV, SMIRNOV, WOLFENSTEIN). IN THE SUN IT TURNS HIGH-ENERGY νe INTO ν₂. IN THE EARTH IT BOOSTS νμ → νe FOR ONE MASS ORDERING AND "+ot+"μ → "+ot+"e FOR THE OTHER.","codex.5.t":"CHERENKOV LIGHT","codex.5.b":"A CHARGED PARTICLE FASTER THAN LIGHT IN A MATERIAL (c/n) EMITS LIGHT ON A CONE: cos θ = 1/(nβ). WATER, n = 1.33: 41°. AIR, n = 1.0003: 1.4°. THE PHOTOMULTIPLIERS ON THE WALLS SEE A RING: SHARP, WITH A HOLE IN THE MIDDLE, FOR A LONG MUON TRACK; BLURRED AND FILLED FOR AN ELECTRON SHOWER. THAT IS HOW SUPER-K TELLS νμ FROM νe. PAVEL CHERENKOV, NOBEL PRIZE 1958.","codex.6.t":"CATCHING THE UNCATCHABLE","codex.6.b":"BIG: SUPER-K HOLDS 50,000 TONNES OF WATER, ICECUBE A CUBIC KILOMETRE OF ANTARCTIC ICE. DEEP: A KILOMETRE OF ROCK STOPS MOST COSMIC MUONS. CLEAN: RADON, POTASSIUM-40, URANIUM AND THORIUM MAKE FAKE SIGNALS. EVEN THEN, SUPER-K SEES ONLY TENS OF SOLAR NEUTRINOS A DAY, WHILE A BILLION BILLION CROSS IT EVERY SECOND.","codex.7.t":"OPEN QUESTIONS","codex.7.b":"HOW HEAVY ARE NEUTRINOS? (KATRIN: LESS THAN 0.45 eV.) WHICH ONE IS THE HEAVIEST (MASS ORDERING)? DO NEUTRINOS AND ANTINEUTRINOS OSCILLATE DIFFERENTLY (CP VIOLATION)? IS THE NEUTRINO ITS OWN ANTIPARTICLE (MAJORANA)? THE NEXT GENERATION OF EXPERIMENTS IS BEING BUILT RIGHT NOW.","q.0":"A NEUTRINO IS BORN AS A νμ. FAR AWAY IT CAN BE DETECTED AS...","q.0.a0":"ONLY A νμ","q.0.a1":"A νe, νμ OR ντ","q.0.a2":"A PHOTON","q.1":"NEUTRINO OSCILLATIONS SHOW THAT NEUTRINOS...","q.1.a0":"HAVE MASS","q.1.a1":"HAVE ELECTRIC CHARGE","q.1.a2":"ARE FASTER THAN LIGHT","q.2":"WHAT DOES A WATER DETECTOR LIKE SUPER-K ACTUALLY SEE?","q.2.a0":"THE NEUTRINO ITSELF","q.2.a1":"LIGHT FROM CHARGED PARTICLES","q.2.a2":"SOUND WAVES IN THE WATER","q.3":"HOW MUCH A NEUTRINO HAS OSCILLATED DEPENDS ON...","q.3.a0":"ITS COLOUR","q.3.a1":"DISTANCE DIVIDED BY ENERGY","q.3.a2":"THE TEMPERATURE","q.4":"WHY ARE NEUTRINO DETECTORS BUILT DEEP UNDERGROUND?","q.4.a0":"TO BLOCK COSMIC MUONS","q.4.a1":"NEUTRINOS ONLY COME FROM BELOW","q.4.a2":"TO KEEP THEM WARM","q.5":"WHAT MAKES THE ELECTRON NEUTRINOS IN THE SUN?","q.5.a0":"NUCLEAR FUSION","q.5.a1":"SUNLIGHT","q.5.a2":"MAGNETIC STORMS","q.6":"ROUGHLY HOW MANY SOLAR NEUTRINOS CROSS YOUR THUMBNAIL EACH SECOND?","q.6.a0":"ABOUT 10","q.6.a1":"ABOUT A MILLION","q.6.a2":"ABOUT 65 BILLION","q.7":"THE ANTINEUTRINOS OF A NUCLEAR REACTOR COME FROM...","q.7.a0":"BETA DECAYS OF FISSION PRODUCTS","q.7.a1":"THE COOLING TOWERS","q.7.a2":"COSMIC RAYS","q.8":"A SHARP CHERENKOV RING USUALLY MEANS...","q.8.a0":"A MUON","q.8.a1":"AN ELECTRON SHOWER","q.8.a2":"A NEUTRON","q.9":"WHICH OF THESE IS STILL UNKNOWN?","q.9.a0":"IF NEUTRINOS OSCILLATE","q.9.a1":"THE NEUTRINO MASS ORDERING","q.9.a2":"IF NEUTRINOS EXIST","en.spiderling":"BETA ELECTRON","en.spiderling.f":"BETA DECAY: n → p + e⁻ + "+ot+"e. THE ELECTRON YOU SEE, THE ANTINEUTRINO YOU DO NOT.","en.spider":"THORIUM-232","en.spider.f":"THORIUM AND URANIUM DECAYING INSIDE THE EARTH MAKE GEONEUTRINOS.","en.cyclops":"EXCITED NUCLEUS","en.cyclops.f":"A NUCLEUS WITH SPARE ENERGY GETS RID OF IT AS A GAMMA RAY.","en.beast":"FAST NEUTRON","en.beast.f":"FAST NEUTRONS CAN FAKE A NEUTRINO SIGNAL. DETECTORS HIDE BEHIND WATER AND ROCK.","en.blob":"URANIUM-235","en.blob.f":"ONE FISSION RELEASES ABOUT 200 MeV AND, THROUGH LATER DECAYS, ABOUT SIX ANTINEUTRINOS.","en.blobling":"FISSION FRAGMENT","en.blobling.f":"FISSION FRAGMENTS HAVE TOO MANY NEUTRONS. THEIR BETA DECAYS MAKE REACTOR ANTINEUTRINOS.","en.bat":"COSMIC MUON","en.bat.f":"ABOUT ONE COSMIC MUON CROSSES YOUR HAND EVERY SECOND.","en.ghost":"DARK NOISE","en.ghost.f":"PHOTOMULTIPLIERS SOMETIMES CLICK WITHOUT ANY LIGHT. THAT IS DARK NOISE.","en.shroom":"POTASSIUM-40","en.shroom.f":"A BANANA HAS ABOUT 15 K-40 DECAYS PER SECOND, YOUR BODY ABOUT 4,000.","en.imp":"SOLAR PLASMA","en.imp.f":"THE SUN'S CORE IS A 15-MILLION-DEGREE SOUP OF BARE NUCLEI AND ELECTRONS.","en.golem":"COSMIC PROTON","en.golem.f":"MOST COSMIC RAYS ARE PROTONS FROM SPACE. THEIR CRASHES IN THE AIR MAKE ATMOSPHERIC NEUTRINOS.","en.bomb":"RADON-222","en.bomb.f":"A RADIOACTIVE GAS THAT SEEPS OUT OF ROCK: A BIG HEADACHE FOR LOW-ENERGY DETECTORS.","en.toad":"TUNNELING ALPHA","en.toad.f":"ALPHA DECAY AND SOLAR FUSION BOTH NEED QUANTUM TUNNELLING THROUGH A BARRIER.","en.snail":"TRITIUM","en.snail.f":"TRITIUM BETA DECAY (HALF-LIFE 12.3 YEARS) IS HOW KATRIN WEIGHS THE NEUTRINO.","en.jelly":"PLASMA BLOB","en.jelly.f":"PLASMA, THE FOURTH STATE OF MATTER: ELECTRONS TORN AWAY FROM THEIR ATOMS.","en.pumpkin":"CHARGED PION π⁺","en.pumpkin.f":"π → μ + νμ: PIONS ARE WHERE ATMOSPHERIC AND BEAM NEUTRINOS COME FROM.","en.cloud":"AIR SHOWER","en.cloud.f":"A SINGLE COSMIC RAY CAN MAKE BILLIONS OF SECONDARY PARTICLES IN THE AIR.","en.worm":"ROCK MUON","en.worm.f":"MUONS MADE BY NEUTRINOS IN THE SURROUNDING ROCK CAN TRAVEL KILOMETRES.","en.beetle":"ALPHA EMITTER","en.beetle.f":"AN ALPHA PARTICLE IS A HELIUM NUCLEUS. A SHEET OF PAPER STOPS IT.","en.owl":"GAMMA RAY","en.owl.f":"A GAMMA RAY IS A PHOTON WITH A MILLION TIMES THE ENERGY OF VISIBLE LIGHT.","en.mimic":"FAKE SIGNAL","en.mimic.f":"NOT EVERY BLIP IS A NEUTRINO. ANALYSES MUST REJECT LOOK-ALIKES.","en.frost":"SOLAR PHOTON","en.frost.f":"LIGHT NEEDS TENS OF THOUSANDS OF YEARS TO STAGGER OUT OF THE SUN. NEUTRINOS NEED TWO SECONDS.","en.moth":"SOLAR WIND","en.moth.f":"THE SUN BLOWS OUT CHARGED PARTICLES AT ABOUT 400 KM PER SECOND.","en.totem":"SPALLATION","en.totem.f":"A FAST MUON CAN SMASH A NUCLEUS. THE PIECES DECAY LATER AND FAKE SIGNALS.","en.fairy":"SYSTEMATIC ERROR","en.fairy.f":"SYSTEMATIC ERRORS DO NOT SHRINK WITH MORE DATA. CAREFUL CALIBRATION FIGHTS THEM.","en.dummy":"TEST TARGET","en.dummy.f":"CALIBRATION SOURCES WITH A KNOWN ENERGY TEACH A DETECTOR WHAT IT SEES.","en.pi0":"NEUTRAL PION π⁰","en.pi0.f":"A QUARK-ANTIQUARK MIX THAT DECAYS INTO TWO GAMMA RAYS IN ABOUT 10⁻¹⁶ S. IN AIR SHOWERS NEUTRAL PIONS FEED THE ELECTRONS AND PHOTONS.","zoo.first.pi0":"1950: BJORKLUND, CRANDALL, MOYER AND YORK AT THE BERKELEY SYNCHROCYCLOTRON.","en.piminus":"NEGATIVE PION π⁻","en.piminus.f":"THE ANTIPARTICLE OF THE π⁺ (d AND ANTI-u). IT DECAYS INTO A MUON AND A MUON ANTINEUTRINO.","zoo.first.piminus":"1947: CECIL POWELL, CÉSAR LATTES AND GIUSEPPE OCCHIALINI, IN COSMIC RAYS.","en.lambda":"LAMBDA Λ⁰","en.lambda.f":"A STRANGE BARYON (u d s), A HYPERON. IT LIVES 0.26 NANOSECONDS, LONG ENOUGH TO FLY A FEW CENTIMETRES, THEN DECAYS INTO p + π⁻.","zoo.first.lambda":"1950: V. D. HOPPER AND S. BISWAS IN MELBOURNE, IN COSMIC-RAY PHOTOGRAPHIC PLATES.","en.sigma":"SIGMA Σ⁺","en.sigma.f":"A STRANGE BARYON (u u s), A HYPERON AND A CLOSE COUSIN OF THE Λ.","zoo.first.sigma":"1953: IN COSMIC RAYS (BONETTI AND COLLEAGUES IN MILAN, AND A GROUP IN THE USA).","en.xi":"XI Ξ⁻ (CASCADE)","en.xi.f":'A DOUBLY STRANGE BARYON (d s s), A HYPERON. IT DECAYS IN STEPS: Ξ⁻ → Λ + π⁻, THEN Λ → p + π⁻. HENCE "CASCADE".',"zoo.first.xi":"1952: ARMENTEROS AND COLLEAGUES IN MANCHESTER, IN COSMIC RAYS.","en.tetraquark":"TETRAQUARK","en.tetraquark.f":"TWO QUARKS AND TWO ANTIQUARKS BOUND TOGETHER. A CHARGED ONE WITH CHARM AND ANTICHARM INSIDE NEEDS AT LEAST FOUR QUARKS.","zoo.first.tetraquark":"2013: BESIII AND BELLE FOUND Zc(3900). (X(3872), FOUND BY BELLE IN 2003, MAY BE ONE TOO.)","en.dmeson":"D MESON D⁰","en.dmeson.f":'THE LIGHTEST CHARMED MESON (c AND ANTI-u). CHARM DECAYS IN COSMIC-RAY SHOWERS MAKE "PROMPT" NEUTRINOS, WHICH ICECUBE SEARCHES FOR.',"zoo.first.dmeson":"1976: THE MARK I DETECTOR AT SLAC (GERSON GOLDHABER, FRANÇOIS PIERRE AND COLLEAGUES).","en.bmeson":"B MESON B⁰","en.bmeson.f":"A b QUARK WITH AN ANTI-d. LIKE A NEUTRINO IT OSCILLATES: B⁰ TURNS INTO ITS OWN ANTIPARTICLE AND BACK.","zoo.first.bmeson":"1983: CLEO AT CORNELL. ITS OSCILLATION: ARGUS AT DESY, 1987.","en.antihydrogen":"ANTIHYDROGEN","en.antihydrogen.f":"AN ANTIPROTON WITH A POSITRON GOING ROUND IT. IN 2023 ALPHA AT CERN SHOWED THAT IT FALLS DOWN, LIKE ORDINARY MATTER.","zoo.first.antihydrogen":"1995: NINE ATOMS AT LEAR, CERN; COLD ANTIHYDROGEN IN 2002 (ATHENA, ATRAP).","zoo.mass.h.nue":"B eV (K⁺, 493.7 MeV)","zoo.mass.antiproton":"9.38 × 10⁸ eV (LIKE THE PROTON)","zoo.mass.gwave":"0 eV: GRAVITONS WOULD BE LIGHTER THAN 1.3 × 10⁻²³ eV (LIGO-VIRGO-KAGRA)","zoo.mass.glashow":"8.04 × 10¹⁰ eV (A W BOSON)","zoo.mass.jpsi":"3.10 × 10⁹ eV (3096.9 MeV)","zoo.mass.upsilon":"9.46 × 10⁹ eV (9460 MeV)","zoo.mass.top":"1.73 × 10¹¹ eV (172.6 GeV)","zoo.mass.higgs":"1.25 × 10¹¹ eV (125.2 GeV)","zoo.mass.pentaquark":"ABOUT 4.45 × 10⁹ eV (Pc(4450))","zoo.mass.omega":"1.67 × 10⁹ eV (1672.5 MeV)","zoo.mass.pi0":"1.35 × 10⁸ eV (135.0 MeV)","zoo.mass.piminus":"1.40 × 10⁸ eV (139.6 MeV)","zoo.mass.lambda":"1.12 × 10⁹ eV (1115.7 MeV)","zoo.mass.sigma":"1.19 × 10⁹ eV (1189.4 MeV)","zoo.mass.xi":"1.32 × 10⁹ eV (1321.7 MeV)","zoo.mass.tetraquark":"ABOUT 3.89 × 10⁹ eV (Zc(3900))","zoo.mass.dmeson":"1.86 × 10⁹ eV (1864.8 MeV)","zoo.mass.bmeson":"5.28 × 10⁹ eV (5279.7 MeV)","zoo.mass.antihydrogen":"9.39 × 10⁸ eV (ANTIPROTON + POSITRON)","zoo.mass.axion1":"6.75 × 10⁻²⁴ eV, FITTED TO GALAXY ROTATION CURVES","zoo.mass.axion2":"ABOUT 3 × 10⁻¹⁹ eV (ESTIMATE: m ∝ LEPTON MASS²)","zoo.mass.axion3":"ABOUT 8 × 10⁻¹⁷ eV (ESTIMATE: m ∝ LEPTON MASS²)","zoo.mass.deaxion":"ABOUT 10⁻³⁶ eV (ESTIMATE: Λ²/M_P WITH Λ_CMB ~ 10⁻⁴ eV)","zoo.mass.gamaron":"1.5 × 10⁻² eV","zoo.mass.blobqueen":"A MASS DIFFERENCE: Δm²₂₁ ≈ 7.5 × 10⁻⁵ eV²","zoo.mass.warden":"AN ANGLE, NO MASS: sin²θ₁₃ ≈ 0.022","zoo.mass.throneeye":"A MASS DIFFERENCE: Δm²₃₂ ≈ 2.45 × 10⁻³ eV²","zoo.mass.king":"|Δm²₃₁| ≈ 2.5 × 10⁻³ eV², ITS SIGN STILL UNKNOWN","zoo.mass.brood":"A PHASE, NO MASS: δCP","zoo.mass.solarpar":"Δm²₂₁ ≈ 7.5 × 10⁻⁵ eV² AND sin²θ₁₂ ≈ 0.31","zoo.mass":"MASS","zoo.src.gamaron":"SOURCE: ARXIV:2401.03243 (SU(2)CMB, PHASE III).","medium.scint":"LIQUID SCINTILLATOR: CHERENKOV CONE 47°, PLUS SCINTILLATION LIGHT","matter.2j":"NONE TO SPEAK OF","stage.2j.name":"JUNO","stage.2j.where":"A 35 M SPHERE OF LIQUID SCINTILLATOR, 700 M UNDERGROUND, CHINA","stage.2j.body":"JUNO HOLDS 20,000 TONNES OF LIQUID SCINTILLATOR IN AN ACRYLIC SPHERE, WATCHED BY ABOUT 17,600 LARGE AND 25,600 SMALL PHOTOMULTIPLIERS. IT SITS 52.5 KM FROM TWO NUCLEAR POWER PLANTS. YOU ARE AN ELECTRON ANTINEUTRINO (ν̄e) WITH 4 MeV: WATCH THE SLOW SWING (θ₁₂) WITH FAST WIGGLES ON TOP. THE PATTERN OF THOSE WIGGLES CARRIES THE MASS ORDERING.","stage.2j.short":"JUNO","stage.2j.real":"JUNO, KAMLAND, DAYA BAY","tick.2j.0":"JUNO STARTED TAKING DATA IN 2025.","tick.2j.1":"A SCINTILLATOR GLOWS WHEN A CHARGED PARTICLE PASSES: FAR MORE LIGHT THAN CHERENKOV LIGHT.","tick.2j.2":"THE WATER POOL AROUND THE SPHERE CATCHES COSMIC MUONS BY THEIR CHERENKOV LIGHT.","tick.2j.3":"KAMLAND IN JAPAN SAW REACTOR ANTINEUTRINOS DISAPPEAR OVER ABOUT 180 KM IN 2002.","tick.2j.4":"REACTOR ANTINEUTRINOS ARE CAUGHT BY INVERSE BETA DECAY: ν̄e + p → n + e⁺.","en.solarpar":"THE SOLAR PARAMETERS","en.solarpar.sub":"HOW PRECISELY?","boss.solarpar.intro":"REACTOR ANTINEUTRINOS CAN TEST THE SUN'S OSCILLATION ON EARTH: OVER ABOUT 50 KM THE SLOW SWING (θ₁₂, Δm²₂₁) TAKES AWAY MOST OF THE ν̄e. BUT HOW PRECISELY DO WE KNOW IT?","boss.solarpar.tip":"WEAK TO μ AND τ: WHAT THE ν̄e TURNED INTO. DODGE ITS CHARGES.","boss.solarpar.defeat":"2002: KAMLAND IN JAPAN SAW REACTOR ANTINEUTRINOS VANISH OVER ABOUT 180 KM, THE SUN'S OSCILLATION ON EARTH. JUNO, 52.5 KM FROM ITS REACTORS, STARTED IN 2025 TO MEASURE θ₁₂ AND Δm²₂₁ BETTER THAN EVER, AND ITS FAST WIGGLES CARRY THE MASS ORDERING.","zoo.first.solarpar":"2002: KAMLAND; MEASURED BETTER THAN EVER BY JUNO SINCE 2025.","medium.sea":"SEA WATER: CHERENKOV CONE 42°","matter.km":"ALMOST NONE: INTERGALACTIC SPACE","hud.mixed":"AVERAGED OUT","stage.km.name":"KM3NET","stage.km.where":"ARCA: 3,450 M DOWN IN THE MEDITERRANEAN, OFF SICILY","stage.km.body":"IN THE PITCH-DARK DEEP SEA, STRINGS OF GLASS SPHERES STAND UP FROM THE SEABED, HELD BY BUOYS. EACH SPHERE HOLDS 31 SMALL PHOTOMULTIPLIERS, AND THE SEA ITSELF IS THE DETECTOR. YOU LEFT A FAR COSMIC ACCELERATOR AS A νμ WITH 100 TeV. AFTER MILLIONS OF LIGHT YEARS YOUR FLAVOURS HAVE AVERAGED OUT, AND NOTHING OSCILLATES HERE: EVERY LEPTON IS A FRESH ROLL OF THE DICE.","stage.km.short":"KM3NET","stage.km.real":"KM3NET (ARCA, ORCA), ANTARES, ICECUBE","tick.km.0":"IN 2023 KM3NET CAUGHT THE MOST ENERGETIC NEUTRINO EVER SEEN: ABOUT 220 PeV (EVENT KM3-230213A).","tick.km.1":"POTASSIUM-40 IN THE SEA SALT DECAYS ALL THE TIME: ITS ELECTRONS MAKE FAINT FLASHES ON EVERY SENSOR.","tick.km.2":"NO SUNLIGHT REACHES 3,450 M. THE ONLY LIGHT DOWN HERE: CHERENKOV LIGHT, POTASSIUM-40 AND GLOWING SEA CREATURES.","tick.km.3":"ORCA, THE SISTER DETECTOR OFF TOULON (FRANCE), USES ATMOSPHERIC NEUTRINOS TO LOOK FOR THE MASS ORDERING.","tick.km.4":"A NEUTRINO TELESCOPE LOOKS DOWN THROUGH THE EARTH: A MUON COMING UP FROM BELOW CAN ONLY BE MADE BY A NEUTRINO.","en.cosmicacc":"THE COSMIC ACCELERATORS","en.cosmicacc.sub":"WHERE DO THEY COME FROM?","boss.cosmicacc.intro":"SOMEWHERE OUT THERE, NATURE ACCELERATES PARTICLES FAR BEYOND ANY MACHINE ON EARTH, AND THEIR PIONS DECAY INTO NEUTRINOS LIKE YOU. ACTIVE GALAXIES? BLAZARS, WHOSE JETS POINT AT US? WHICH ONES, AND HOW?","boss.cosmicacc.tip":"WEAK TO μ: ONLY A MUON TRACK POINTS BACK TO ITS SOURCE PRECISELY. DODGE THE JET WHEN IT POINTS AT YOU.","boss.cosmicacc.defeat":"2013: ICECUBE SAW NEUTRINOS FROM FAR BEYOND THE SOLAR SYSTEM. 2017: ONE OF THEM POINTED BACK TO THE BLAZAR TXS 0506+056, AND IN 2022 ICECUBE SAW THE ACTIVE GALAXY NGC 1068 GLOW IN NEUTRINOS. IN 2023 KM3NET RECORDED THE MOST ENERGETIC NEUTRINO EVER, ABOUT 220 PeV (PUBLISHED 2025). WHERE MOST COSMIC NEUTRINOS COME FROM IS STILL OPEN.","zoo.first.cosmicacc":"2013: ICECUBE (COSMIC NEUTRINOS); 2017/18: TXS 0506+056; 2022: NGC 1068.","zoo.mass.cosmicacc":"NOT A PARTICLE: THE BLACK HOLE IN NGC 1068 HOLDS ABOUT 10⁷ SUN MASSES, ROUGHLY 10⁷³ eV.","zoo.src.cosmicacc":"SOURCES: ICECUBE, SCIENCE 342 (2013), 361 (2018), 378 (2022); KM3NET, NATURE 638, 376 (2025).","en.deuteron":"DEUTERON","en.deuteron.f":"THE SUN'S FIRST FUSION STEP: p + p → d + e⁺ + νe. EVERY DEUTERON MADE THERE SENDS OUT ONE OF YOU.","zoo.first.deuteron":"1931: HAROLD UREY FOUND HEAVY HYDROGEN (DEUTERIUM) IN THE SPECTRUM OF HYDROGEN.","en.positron":"POSITRON","en.positron.f":"THE ELECTRON'S ANTIPARTICLE. THE SUN MAKES ONE WITH EVERY DEUTERON, AND REACTOR DETECTORS SPOT ANTINEUTRINOS BY THE POSITRON THEY MAKE.","zoo.first.positron":"1932: CARL ANDERSON SAW IT IN COSMIC RAYS IN A CLOUD CHAMBER (PAUL DIRAC HAD PREDICTED IT IN 1928).","en.gluon":"GLUON","en.gluon.f":"GLUONS CARRY THE STRONG FORCE AND GLUE QUARKS TOGETHER. THEY CARRY COLOUR CHARGE THEMSELVES, SO THEY EVEN STICK TO EACH OTHER.","zoo.first.gluon":"1979: THREE-JET EVENTS AT THE PETRA COLLIDER, DESY, HAMBURG.","en.positronium":"POSITRONIUM","en.positronium.f":"AN ELECTRON AND A POSITRON ORBITING EACH OTHER LIKE A TINY HYDROGEN ATOM, UNTIL THEY ANNIHILATE INTO GAMMA RAYS.","zoo.first.positronium":"1951: MARTIN DEUTSCH, MIT.","en.kaon":"KAON","en.kaon.f":'THE FIRST "STRANGE" PARTICLE. KAONS ALSO SHOWED THE FIRST CP VIOLATION, IN 1964.',"zoo.first.kaon":"1947: GEORGE ROCHESTER AND CLIFFORD BUTLER, COSMIC RAYS IN A CLOUD CHAMBER, MANCHESTER.","en.antiproton":"ANTIPROTON","en.antiproton.f":"A PROTON WITH EVERY CHARGE REVERSED. COSMIC RAYS CARRY A FEW, AND AMS ON THE SPACE STATION COUNTS THEM.","zoo.first.antiproton":"1955: OWEN CHAMBERLAIN AND EMILIO SEGRÈ AT THE BEVATRON, BERKELEY.","en.gwave":"GRAVITATIONAL WAVE","en.gwave.f":"A RIPPLE OF SPACE-TIME FROM COLLIDING BLACK HOLES. IT PASSES THROUGH THE EARTH ALMOST AS EASILY AS YOU DO.","zoo.first.gwave":"2015: LIGO (GW150914), TWO BLACK HOLES MERGING ABOUT 1.3 BILLION LIGHT YEARS AWAY.","en.glashow":"GLASHOW RESONANCE","en.glashow.f":"AN ANTINEUTRINO OF 6.3 PeV HITS AN ELECTRON IN THE ICE AND MAKES A REAL W⁻ BOSON.","zoo.first.glashow":"PREDICTED BY SHELDON GLASHOW IN 1960. ICECUBE SAW ONE (RECORDED 2016, PUBLISHED 2021).","en.jpsi":"J/ψ","en.jpsi.f":"A CHARM QUARK AND ITS ANTIQUARK. TWO LABS FOUND IT IN THE SAME WEEK, SO IT HAS TWO NAMES.","zoo.first.jpsi":'1974: SLAC (BURTON RICHTER) AND BROOKHAVEN (SAMUEL TING), THE "NOVEMBER REVOLUTION".',"en.upsilon":"UPSILON","en.upsilon.f":"A BOTTOM QUARK AND ITS ANTIQUARK: THE FIRST SIGN OF THE THIRD QUARK FAMILY.","zoo.first.upsilon":"1977: LEON LEDERMAN'S TEAM AT FERMILAB.","en.top":"TOP QUARK","en.top.f":"THE HEAVIEST KNOWN PARTICLE, ABOUT AS HEAVY AS A GOLD ATOM. IT DECAYS BEFORE IT CAN EVEN JOIN A HADRON.","zoo.first.top":"1995: CDF AND D0 AT THE TEVATRON, FERMILAB.","en.higgs":"HIGGS BOSON","en.higgs.f":"THE HIGGS FIELD GIVES THE W, THE Z, THE QUARKS AND THE CHARGED LEPTONS THEIR MASS. WHERE NEUTRINO MASSES COME FROM IS STILL OPEN.","zoo.first.higgs":"2012: ATLAS AND CMS AT THE LHC, CERN (PREDICTED IN 1964).","en.pentaquark":"PENTAQUARK","en.pentaquark.f":"FOUR QUARKS AND AN ANTIQUARK BOUND TOGETHER, SEARCHED FOR SINCE THE 1960s.","zoo.first.pentaquark":"2015: LHCb AT CERN.","en.omega":"OMEGA-MINUS","en.omega.f":`Ω⁻: THREE STRANGE QUARKS. GELL-MANN'S "EIGHTFOLD WAY" PREDICTED ITS MASS BEFORE ANYONE SAW IT.`,"zoo.first.omega":"1964: BROOKHAVEN NATIONAL LABORATORY.","en.axion1":"AXION (e)","en.axion1.f":"POSTULATED, NOT FOUND. IN SU(2) YANG-MILLS THERMODYNAMICS (YMTD) EACH LEPTON FAMILY BRINGS ITS OWN ULTRALIGHT AXION, AND THEIR FUZZY LUMPS ARE THE DARK MATTER OF GALAXIES. THE e-AXION IS THE LIGHTEST AND MAKES UP MOST OF A GALAXY'S DARK MASS.","zoo.first.axion1":"NOT OBSERVED.","en.axion2":"AXION (μ)","en.axion2.f":"POSTULATED, NOT FOUND. THE AXION OF THE MUON FAMILY IN YMTD: HEAVIER, SO ITS LUMPS ARE SMALLER AND DENSER.","zoo.first.axion2":"NOT OBSERVED.","en.axion3":"AXION (τ)","en.axion3.f":"POSTULATED, NOT FOUND. THE AXION OF THE TAU FAMILY IN YMTD: ITS DENSE LUMPS MIGHT SIT IN GALACTIC CENTRES AND GLOBULAR CLUSTERS.","zoo.first.axion3":"NOT OBSERVED.","en.axion4":"AXION IV","en.axion4.f":"POSTULATED, NOT FOUND. THE FOURTH DARK-MATTER AXION OF YMTD. LIKE ALL AXIONS IT WOULD HARDLY EVER INTERACT: EVEN LESS THAN YOU.","zoo.first.axion4":"NOT OBSERVED.","en.deaxion":"CMB AXION (DARK ENERGY)","en.deaxion.f":"POSTULATED, NOT FOUND. THE AXION OF SU(2)CMB, THE YANG-MILLS THEORY THAT IN YMTD DESCRIBES THE COSMIC MICROWAVE BACKGROUND. ITS GLOBAL CONDENSATE ACTS AS DARK ENERGY, THE PUSH BEHIND THE ACCELERATING EXPANSION.","zoo.first.deaxion":"NOT OBSERVED. THE ACCELERATING EXPANSION ITSELF WAS DISCOVERED IN 1998 (SUPERNOVA SURVEYS).","en.gamaron":"GAMMARON","en.gamaron.f":"POSTULATED, NOT FOUND. WHEN THE COSMIC MICROWAVE BACKGROUND HAS COOLED TO 2.27 K (THE HAGEDORN TEMPERATURE OF SU(2)CMB), PART OF ITS GROUND STATE TURNS INTO A VERY LIGHT LEPTON FAMILY WHOSE CHARGED MEMBERS ARE THE GAMMARON AND THE ANTIGAMMARON. THE CMB IS 2.725 K TODAY, SO THIS LIES IN THE FUTURE.","zoo.first.gamaron":"NOT OBSERVED: THE UNIVERSE IS NOT COLD ENOUGH YET.","zoo.first.spiderling":"1899: ERNEST RUTHERFORD NAMED BETA RAYS; IN 1900 HENRI BECQUEREL SHOWED THEY ARE ELECTRONS.","zoo.first.spider":"1828: JÖNS JACOB BERZELIUS FOUND THORIUM; ITS RADIOACTIVITY WAS SEEN IN 1898 (GERHARD SCHMIDT, MARIE CURIE).","zoo.first.cyclops":"1900: PAUL VILLARD FOUND GAMMA RAYS, THE LIGHT OF EXCITED NUCLEI.","zoo.first.beast":"1932: JAMES CHADWICK DISCOVERED THE NEUTRON.","zoo.first.blob":"1935: ARTHUR DEMPSTER FOUND URANIUM-235; IN 1938 OTTO HAHN AND FRITZ STRASSMANN SPLIT URANIUM.","zoo.first.blobling":"1938-39: HAHN AND STRASSMANN FOUND FISSION PRODUCTS; LISE MEITNER AND OTTO FRISCH EXPLAINED THEM.","zoo.first.bat":"1936: CARL ANDERSON AND SETH NEDDERMEYER, IN COSMIC RAYS.","zoo.first.ghost":"AS OLD AS THE PHOTOMULTIPLIER ITSELF (1930s).","zoo.first.shroom":"1906: NORMAN CAMPBELL AND ALEXANDER WOOD FOUND POTASSIUM'S RADIOACTIVITY; ALFRED NIER IDENTIFIED POTASSIUM-40 IN 1935.","zoo.first.imp":"1938: HANS BETHE WORKED OUT THE FUSION THAT HEATS THE SOLAR PLASMA.","zoo.first.golem":"1912: VICTOR HESS FOUND COSMIC RAYS ON A BALLOON FLIGHT.","zoo.first.bomb":"1900: FRIEDRICH ERNST DORN FOUND RADON.","zoo.first.toad":"1899: RUTHERFORD NAMED ALPHA RAYS; IN 1928 GEORGE GAMOW EXPLAINED THEM AS TUNNELLING.","zoo.f DPRTO","pop.throw0.t":"ELEKTRON!","pop.throw0.b":'TVOJ νe JE ZADEL JEDRO IN SE Z IZMENJAVO BOZONA W ("NABITI TOK") SPREMENIL V ELEKTRON. LAHEK ELEKTRON SE VELIKO SIPA IN USTVARI PLAZ DELCEV: NJEGOV ČERENKOV STOŽEC JE ZABRISAN IN POLN, NA STENI PA NASTANE MEGLEN OBROČ.',"pop.throw1.t":"MION!","pop.throw1.b":"MION JE 200-KRAT TEŽJI OD ELEKTRONA. LETI NARAVNOST IN DALEČ, PREBODE VSE NA SVOJI POTI. NJEGOV ČERENKOV STOŽEC JE OSTER IN VOTEL: KO SE SLED KONČA, SVETLOBA LETI NAPREJ KOT OBROČ Z LUKNJO NA SREDINI.","pop.throw2.t":"TAUON!","pop.throw2.b":'TAUON JE 3.500-KRAT TEŽJI OD ELEKTRONA IN RAZPADE SKORAJ TAKOJ: EN POK, KJER NASTANE, DRUGI, KJER RAZPADE. ICECUBE IŠČE TAKŠNE "DVOJNE POKE".',"pop.dice.t":"KVANTNA KOCKA","pop.dice.b":"KATERI LEPTON VRŽEŠ, ODLOČI NAKLJUČJE. STOLPCI KAŽEJO VERJETNOSTI: 70% μ POMENI, DA JE SEDEM OD DESETIH METOV MIONOV. KVANTNA MEHANIKA DA LE VERJETNOSTI.","pop.cherenkov.t":"ČERENKOVA SVETLOBA","pop.cherenkov.b":"V VODI SVETLOBA POTUJE LE S 75% SVOJE HITROSTI V VAKUUMU. NABIT DELEC, KI JE HITREJŠI, ZA SABO PUSTI STOŽEC MODRE SVETLOBE, KOT ZVOČNI POK LETALA: cos θ = 1/(nβ), V VODI 41°.","pop.osc.t":"SPREMENIL SI OKUS!","pop.osc.b":"NEVTRINO JE MEŠANICA TREH MASNIH STANJ ν₁, ν₂, ν₃. POTUJEJO Z MALO RAZLIČNIMI RITMI, ZATO SE MEŠANICA IN S TEM TVOJ OKUS SPREMINJATA Z RAZDALJO / ENERGIJO (L/E). TO JE MOGOČE LE, ČE IMAJO NEVTRINI MASO.","pop.pass.t":"ŠLO JE SKOZI TEBE","pop.pass.b":"NEVTRINI SKORAJ NIKOLI NE INTERAGIRAJO. SVETLOBNO LETO SVINCA BI USTAVILO LE OKOLI POLOVICO SONČEVIH NEVTRINOV. TU GRE SKOZI TEBE OKOLI POLOVICA VSEH ZADETKOV.","pop.nc.t":"NEVTRALNI TOK","pop.nc.b":"Z BOZONOM Z SE NEVTRINO LAHKO ZALETI V SNOV, NE DA BI POSTAL NABIT LEPTON. ZA VSE OKUSE DELUJE ENAKO, ZATO NE POZNA ŠIBKOSTI. SNO JE Z NJIM PREŠTEL VSE SONČEVE NEVTRINE.","pop.w.t":"BOZON W: SI NABIT LEPTON","pop.w.b":"KO NEVTRINO ABSORBIRA W, POSTANE SVOJ NABITI PARTNER. NABITI DELCI ČUTIJO ELEKTRIČNE SILE: NIČ VEČ NE GRE SKOZI TEBE, A ZADENEŠ MOČNEJE IN SIJEŠ ČERENKOVO SVE
