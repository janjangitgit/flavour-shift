age.0.body":"RESEARCH REACTORS LIKE THE TRIGA AT THE JOŽEF STEFAN INSTITUTE NEAR LJUBLJANA SIT AT THE BOTTOM OF A POOL OF WATER. TRIGA STANDS FOR TRAINING, RESEARCH, ISOTOPES, GENERAL ATOMICS. THE BLUE GLOW AROUND THE CORE IS CHERENKOV LIGHT. YOU ARE A MUON NEUTRINO (νμ) FROM A COSMIC-RAY SHOWER, PASSING THROUGH WITH 1 GeV. LEARN TO MOVE, THROW LEPTONS AND CHANGE FLAVOUR.","stage.1.name":"INSIDE THE SUN","stage.1.where":"FROM THE CORE (15 MILLION °C) OUT TO THE SURFACE","stage.1.body":"FUSION TURNS HYDROGEN INTO HELIUM AND MAKES ELECTRON NEUTRINOS: 65 BILLION OF THEM CROSS EVERY SQUARE CENTIMETRE OF YOUR SKIN EACH SECOND. YOU ARE A νe WITH 10 MeV. WATCH THE BARS: THE DENSE PLASMA ITSELF CHANGES HOW YOU OSCILLATE (THE MSW EFFECT). ON THE WAY OUT ONLY ABOUT ONE THIRD OF YOU STAYS νe.","stage.2.name":"DAYA BAY","stage.2.where":"REACTOR ANTINEUTRINO DETECTORS IN A WATER POOL, CHINA","stage.2.body":"NUCLEAR REACTORS ARE THE STRONGEST NEUTRINO SOURCES WE BUILD: SLOVENIA'S KRŠKO PLANT ALONE SENDS OUT ABOUT 4×10²⁰ ELECTRON ANTINEUTRINOS EVERY SECOND. AT DAYA BAY IN CHINA, DETECTORS STOOD IN WATER POOLS 0.5 TO 2 KM FROM SIX REACTOR CORES. YOU ARE AN ELECTRON ANTINEUTRINO ("+_+"e) WITH 4 MeV. WATCH FOR A SMALL FAST DIP (θ₁₃, FOUND HERE IN 2012) AND A BIG SLOW ONE (θ₁₂, SEEN BY KAMLAND).","stage.3.name":"THE ATMOSPHERE","stage.3.where":"OVER THE PIERRE AUGER OBSERVATORY, ARGENTINA","stage.3.body":"COSMIC RAYS FROM SPACE SMASH INTO AIR NUCLEI HIGH ABOVE THE GROUND AND MAKE SHOWERS OF PIONS, WHICH DECAY INTO MUONS AND MUON NEUTRINOS. THE PIERRE AUGER OBSERVATORY CATCHES SUCH SHOWERS WITH 1,660 WATER TANKS LIKE THIS ONE, SPREAD OVER 3,000 KM². YOU ARE A νμ WITH 1 GeV. OVER A FEW HUNDRED KM YOU SWING FROM μ TO τ AND BACK: THIS IS HOW OSCILLATION WAS DISCOVERED IN 1998.","stage.4.name":"THROUGH THE EARTH TO ICECUBE","stage.4.where":"UP THROUGH THE WHOLE EARTH, INTO THE SOUTH POLE ICE","stage.4.body":'YOU CAME UP THROUGH THE WHOLE EARTH, AS ALMOST EVERY NEUTRINO DOES, UNTOUCHED. YOU ARE A νμ WITH 6 GeV, AND THE DENSE ROCK HELPS νμ TURN INTO νe, BUT ONLY IF THE MASS ORDERING IS "NORMAL". NOW YOU ARE IN ICECUBE: 5,160 LIGHT SENSORS ON 86 STRINGS, 1.5 TO 2.5 KM DEEP IN THE ANTARCTIC ICE. THE BUILDING ON TOP IS THE ICECUBE LAB.',"stage.5.name":"SUPER-KAMIOKANDE","stage.5.where":"1 KM UNDER MOUNT IKENO, JAPAN","stage.5.body":"A STEEL TANK 41 M TALL WITH 50,000 TONNES OF ULTRA-PURE WATER, LINED WITH 11,000 PHOTOMULTIPLIERS. YOU ARE A νμ FROM THE T2K BEAM, SENT 295 KM THROUGH THE ROCK FROM TOKAI, WITH 0.6 GeV. YOUR LEPTONS DRAW RINGS OF CHERENKOV LIGHT ON THE WALLS: SHARP FOR μ, FUZZY FOR e.","stage.real":"REAL EXPERIMENTS","stage.0.short":"TRAINING","stage.1.short":"THE SUN","stage.2.short":"DAYA BAY","stage.3.short":"ATMOSPHERE","stage.4.short":"ICECUBE","stage.5.short":"SUPER-K","stage.0.real":"TRIGA RESEARCH REACTORS, E.G. JSI LJUBLJANA","stage.1.real":"HOMESTAKE, SUPER-K, SNO, BOREXINO","stage.2.real":"DAYA BAY, RENO, DOUBLE CHOOZ, KAMLAND, JUNO","stage.3.real":"PIERRE AUGER (COSMIC RAYS), SUPER-K, ICECUBE","stage.4.real":"ICECUBE, KM3NET/ORCA, SUPER-K","stage.5.real":"SUPER-K AND T2K, HYPER-K, NOVA, DUNE","stage.you":"YOU","stage.energy":"ENERGY","stage.matter":"MATTER","stage.medium":"LIGHT HERE","medium.water":"WATER: CHERENKOV CONE 41°","medium.plasma":"PLASMA: OPAQUE, LIGHT IS SWALLOWED","medium.air":"AIR: A NARROW 1.4° CONE","medium.rock":"ROCK: OPAQUE","medium.ice":"ICE: CHERENKOV CONE 40°","sun.core":"CORE · 15 MILLION °C","sun.rad":"RADIATIVE ZONE","sun.rad.sub":"LIGHT ZIGZAGS OUT","sun.conv":"CONVECTION ZONE","sun.surf":"SURFACE · 5500 °C","sun.corona":"CORONA · MILLIONS OF °C","photo.juno":"PICTURE: THE JUNO DETECTOR, CHINA","photo.core":"PICTURE: A RESEARCH REACTOR CORE","matter.0":"NONE TO SPEAK OF","matter.1":"VERY DENSE, THINNING OUT (MSW)","matter.2":"WATER (TOO LITTLE TO MATTER)","matter.3":"THIN AIR","matter.4":"THE WHOLE EARTH (MATTER EFFECT)","matter.5":"WATER (TOO LITTLE TO MATTER)","boss.blobqueen.intro":"1968: RAY DAVIS COUNTED SOLAR νe WITH 615 TONNES OF CLEANING FLUID DEEP IN THE HOMESTAKE MINE. HE FOUND ONLY ABOUT ONE THIRD OF WHAT THE SUN SHOULD MAKE. FOR 30 YEARS NOBODY KNEW WHERE THE REST WENT.","boss.blobqueen.tip":"WEAK TO μ AND τ. YOUR Z PULSE (RIGHT CLICK) SEES ALL FLAVOURS: IT HITS ×3.","boss.blobqueen.defeat":"2001-2002: SNO IN CANADA USED HEAVY WATER TO COUNT ONLY νe (CHARGED CURRENT) AND ALL FLAVOURS AT ONCE (NEUTRAL CURRENT). ALL FLAVOURS TOGETHER GAVE THE FULL SOLAR FLUX: NOTHING WAS MISSING, THE νe HAD CHANGED INTO νμ AND ντ. NOBEL PRIZES 2002 (DAVIS, KOSHIBA) AND 2015 (McDONALD).","boss.warden.intro":"THREE MIXING ANGLES SAY HOW FLAVOURS AND MASS STATES MIX. θ₁₂ AND θ₂₃ ARE LARGE. THE THIRD, θ₁₃, WAS SO SMALL THAT IT STAYED HIDDEN UNTIL 2012.","boss.warden.tip":"WEAK TO μ AND τ: THE FEW ANTINEUTRINOS THAT STOP BEING e.","boss.warden.defeat":"2012: DAYA BAY (CHINA), RENO (KOREA) AND DOUBLE CHOOZ (FRANCE) SAW ABOUT 6% OF REACTOR ANTINEUTRINOS VANISH AFTER 1-2 KM: θ₁₃ ≈ 8.6°. SMALL, BUT NOT ZERO, AND THAT MAKES THE SEARCH FOR CP VIOLATION POSSIBLE.","boss.throneeye.intro":"IN THE 1980S AND 90S, DETECTORS COUNTED TOO FEW MUON NEUTRINOS FROM THE ATMOSPHERE. A MISTAKE IN THE MODELS? OR SOMETHING NEW?","boss.throneeye.tip":"IT SHRUGS OFF μ. HIT IT WITH τ: THAT IS WHAT THE MISSING νμ BECAME.","boss.throneeye.defeat":"1998: SUPER-KAMIOKANDE SHOWED THAT νμ COMING UP THROUGH THE EARTH (13,000 KM) WERE MISSING, WHILE THOSE FROM ABOVE (15 KM) WERE NOT. THE DEFICIT FOLLOWED L/E EXACTLY: OSCILLATION! THE FIRST PROOF THAT NEUTRINOS HAVE MASS. NOBEL PRIZE 2015 (KAJITA).","boss.king.intro":'WE KNOW THE DIFFERENCES OF THE SQUARED NEUTRINO MASSES, BUT NOT THEIR ORDER. IS ν₃ THE HEAVIEST ("NORMAL") OR THE LIGHTEST ("INVERTED")?',"boss.king.tip":"IT FLIPS ITS ORDER. NORMAL: WEAK TO e. INVERTED: WEAK TO μ.","boss.king.defeat":"STILL AN OPEN QUESTION! JUNO (CHINA), DUNE (USA), HYPER-KAMIOKANDE (JAPAN), ICECUBE AND KM3NET/ORCA IN THE MEDITERRANEAN ARE ON IT. MATTER IN THE EARTH BOOSTS νμ→νe ONLY FOR ONE OF THE TWO ORDERINGS.","boss.brood.intro":"THE PHASE δCP COULD MAKE NEUTRINOS AND ANTINEUTRINOS OSCILLATE DIFFERENTLY. THAT COULD HELP EXPLAIN WHY THE UNIVERSE IS MADE OF MATTER AND NOT ANTIMATTER.","boss.brood.tip":"ITS WEAKNESS TURNS WITH THE NEEDLE. HALFWAY, THE BEAM FLIPS YOU INTO AN ANTINEUTRINO.","boss.brood.defeat":"STILL OPEN! T2K AND NOVA SEE HINTS. DUNE AND HYPER-KAMIOKANDE, STARTING IN THE LATE 2020S, AIM FOR A DISCOVERY. MAYBE YOU WILL BE ON THE TEAM.","boss.history":"HISTORY","boss.tip":"HOW TO BEAT IT","boss.solved":"SOLVED","boss.open":"STILL OPEN","pop.throw0.t":"ELECTRON!","pop.throw0.b":'YOUR νe HIT A NUCLEUS AND TURNED INTO AN ELECTRON BY SWAPPING A W BOSON (A "CHARGED CURRENT"). A LIGHT ELECTRON SCATTERS A LOT AND MAKES A SHOWER: ITS CHERENKOV CONE IS FUZZY AND FILLED, AND ON THE WALL IT MAKES A BLURRED RING.',"pop.throw1.t":"MUON!","pop.throw1.b":"THE MUON IS 200 TIMES HEAVIER THAN THE ELECTRON. IT FLIES STRAIGHT AND FAR, PIERCING EVERYTHING IN ITS WAY. ITS CHERENKOV CONE IS SHARP AND HOLLOW: WHEN THE TRACK ENDS, THE LIGHT FLIES ON AS A RING WITH A HOLE IN THE MIDDLE.","pop.throw2.t":"TAU!","pop.throw2.b":'THE TAU IS 3,500 TIMES HEAVIER THAN THE ELECTRON AND DECAYS ALMOST AT ONCE: ONE BANG WHERE IT IS MADE, A SECOND WHERE IT DECAYS. ICECUBE SEARCHES FOR SUCH "DOUBLE BANGS".',"pop.dice.t":"QUANTUM DICE","pop.dice.b":"WHICH LEPTON YOU THROW IS DECIDED BY CHANCE. THE BARS SHOW THE ODDS: 70% μ MEANS SEVEN THROWS IN TEN ARE MUONS. QUANTUM MECHANICS ONLY GIVES PROBABILITIES.","pop.cherenkov.t":"CHERENKOV LIGHT","pop.cherenkov.b":"IN WATER, LIGHT TRAVELS AT ONLY 75% OF ITS VACUUM SPEED. A CHARGED PARTICLE FASTER THAN THAT LEAVES A CONE OF BLUE LIGHT BEHIND, LIKE THE SONIC BOOM OF A JET: cos θ = 1/(nβ), 41° IN WATER.","pop.osc.t":"YOU CHANGED FLAVOUR!","pop.osc.b":"A NEUTRINO IS A MIX OF THREE MASS STATES ν₁, ν₂, ν₃. THEY TRAVEL WITH SLIGHTLY DIFFERENT RHYTHMS, SO THE MIX, AND YOUR FLAVOUR, DRIFTS WITH DISTANCE / ENERGY (L/E). THIS IS ONLY POSSIBLE IF NEUTRINOS HAVE MASS.","pop.pass.t":"IT WENT RIGHT THROUGH YOU","pop.pass.b":"NEUTRINOS HARDLY EVER INTERACT. A LIGHT-YEAR OF LEAD WOULD STOP ONLY ABOUT HALF OF THE NEUTRINOS FROM THE SUN. HERE ABOUT HALF OF ALL HITS PASS THROUGH YOU.","pop.nc.t":"NEUTRAL CURRENT","pop.nc.b":"WITH A Z BOSON A NEUTRINO CAN BUMP INTO MATTER WITHOUT TURNING INTO A CHARGED LEPTON. IT WORKS THE SAME FOR ALL FLAVOURS, SO IT IGNORES WEAKNESSES. SNO USED IT TO COUNT ALL SOLAR NEUTRINOS.","pop.w.t":"W BOSON: YOU ARE A CHARGED LEPTON","pop.w.b":"ABSORBING A W TURNS A NEUTRINO INTO ITS CHARGED PARTNER. CHARGED PARTICLES FEEL ELECTRIC FORCES: NOTHING PASSES THROUGH YOU NOW, BUT YOU HIT HARDER AND SHINE CHERENKOV LIGHT. HEAVY LEPTONS DO NOT LAST LONG...","pop.wend.0.t":"ELECTRON CAPTURE","pop.wend.0.b":"ELECTRONS ARE STABLE. HERE A PROTON CAPTURES YOU (e + p → n + νe), AND YOU ARE A νe AGAIN.","pop.wend.1.t":"MUON DECAY","pop.wend.1.b":"A MUON LIVES 2.2 MICROSECONDS, THEN DECAYS: μ → e + "+_+"e + νμ. YOU ARE A νμ AGAIN.","pop.wend.2.t":"TAU DECAY","pop.wend.2.b":'A TAU LIVES 0.3 PICOSECONDS. ITS DECAY ALWAYS MAKES A ντ ("TAU REGENERATION"): YOU ARE A ντ AGAIN.',"pop.msw.t":"THE MSW EFFECT","pop.msw.b":"ELECTRON NEUTRINOS ALSO SCATTER OFF THE ELECTRONS OF THE SUN. THIS EXTRA PUSH CHANGES THE MIXING. WHERE THE DENSITY IS JUST RIGHT, νe TURNS SMOOTHLY INTO ν₂, AND ν₂ LEAVES THE SUN AS ABOUT 1/3 νe AND 2/3 νμ + ντ.","pop.anti.t":"ANTINEUTRINOS","pop.anti.b":"REACTORS MAKE ELECTRON ANTINEUTRINOS ("+_+'e), THE ANTIMATTER TWINS OF νe. THEY OSCILLATE THE SAME WAY, EXCEPT FOR THE CP PHASE. THE BAR OVER THE ν MEANS "ANTI".',"pop.flip.t":"NEUTRINO OR ANTINEUTRINO?","pop.flip.b":"BEAM EXPERIMENTS FLIP THE CURRENT IN THEIR MAGNETIC HORNS TO MAKE "+_+"μ INSTEAD OF νμ. IF THE TWO OSCILLATE DIFFERENTLY, CP SYMMETRY IS BROKEN. YOU ARE NOW A "+_+"μ!","pop.evidence.t":"3σ: EVIDENCE","pop.evidence.b":'SIGNIFICANCE GROWS LIKE THE SQUARE ROOT OF YOUR EVENTS: FOUR TIMES MORE DATA GIVES TWICE THE σ. AT 3σ A RANDOM FLUKE WOULD BE THIS BIG ONLY 0.3% OF THE TIME. PHYSICISTS CALL IT "EVIDENCE", NOT YET A DISCOVERY.',"pop.discovery.t":"5σ: DISCOVERY!","pop.discovery.b":"AT 5σ THE CHANCE OF A FLUKE IS BELOW 1 IN 3.5 MILLION. THAT IS THE RULE FOR CLAIMING A DISCOVERY IN PARTICLE PHYSICS, USED FOR OSCILLATIONS AND FOR THE HIGGS BOSON.","pop.arcade.t":"ARCADE MODE","pop.arcade.b":"IN ARCADE MODE EVERY DODGE SIMPLY SWITCHES e → μ → τ. REAL NEUTRINOS DRIFT SMOOTHLY: TRY THE REAL OSCILLATION MODE IN SETTINGS.","pop.more":"MORE IN THE PHYSICS CODEX (PAUSE MENU)","tut.move":"MOVE WITH A / D (OR ← →)","tut.jump":"JUMP WITH W, ↑ OR SPACE. HOLD IT TO KEEP JUMPING HIGHER.","tut.throw":"AIM WITH THE MOUSE AND THROW A LEPTON WITH THE LEFT BUTTON OR E. HOLD IT TO KEEP THROWING.","tut.bars":"BELOW: YOUR FLAVOUR MIX. ORANGE e, MAGENTA μ, VIOLET τ. EACH THROW IS ROLLED FROM THESE ODDS.","tut.travel":"NOW WALK AROUND AND WATCH THE BARS: TRAVELLING CHANGES YOUR FLAVOUR. THAT IS OSCILLATION!","tut.dodge":"DODGE WITH SHIFT. A DODGE IS A QUICK HOP IN DISTANCE: IT FLIPS μ ↔ τ.","tut.weak":"THE LETTER ABOVE A TARGET IS ITS WEAK FLAVOUR (×2, OTHERS ×0.6). STAND STILL TO KEEP YOUR FLAVOUR, MOVE TO CHANGE IT.","tut.nc":"Z PULSE: RIGHT MOUSE BUTTON, Z OR Q. IT HITS EVERYTHING NEARBY, WHATEVER THE FLAVOUR.","tut.w":"A W BOSON! TOUCH IT TO BECOME A CHARGED LEPTON FOR A FEW SECONDS.","tut.wave":"LAST TEST: SURVIVE A SHOWER OF COSMIC MUONS!","tut.done":"TRAINING COMPLETE!","tut.skip":"TAB: SKIP STEP","tut.step":"TRAINING {n}/{of}","cr.title":"CONTROL ROOM","cr.cleared":"STAGE {n} CLEARED","cr.events":"EVENTS","cr.time":"TIME","cr.data":"DATA EARNED","cr.throws":"LEPTONS THROWN","cr.cards":"CARD SHOP","cr.quiz":"QUIZ BONUS","cr.repair":"REPAIR +8 HP ({p} DATA)","cr.next":"NEXT STAGE","cr.buy":"BUY","cr.sold":"SOLD","cr.reroll":"NEW CARDS {n}","cr.nodata":"NOT ENOUGH DATA","cr.full":"ALREADY AT FULL HP","cr.tap":"CLICK A CARD TO READ IT","cr.right":"CORRECT! +{n} DATA","cr.wrong":"NOT QUITE. THE ANSWER: {a}","cr.answered":"QUIZ DONE FOR THIS STAGE","cr.healed":"THE CREW PATCHED YOU UP +{n}","cr.upnext":"NEXT","res.win":"JOURNEY COMPLETE!","res.lose":"ABSORBED","res.score":"SCORE","res.stage":"STAGE REACHED","res.events":"EVENTS","res.sigma":"SIGNIFICANCE","res.time":"TIME","res.throws":"e / μ / τ THROWN","res.again":"PLAY AGAIN","res.retry":"RETRY STAGE {n}","res.retry.hint":"RETRY KEEPS YOUR CARDS AND DATA FROM THE START OF THE STAGE (ENTER)","res.title":"TITLE","res.new":"NEW HIGH SCORE! TYPE YOUR INITIALS","res.enter":"ENTER TO SAVE","res.top":"TOP 10","res.empty":"NO SCORES YET","quiz.pre":"QUICK QUIZ: WHAT DO YOU THINK?","quiz.post":"AND NOW?","quiz.pre.sub":"THREE QUESTIONS. NO WRONG GUESSES, IT HELPS US SEE WHAT YOU LEARN.","quiz.post.sub":"THE SAME THREE QUESTIONS AGAIN.","quiz.n":"QUESTION {n}/{of}","quiz.keys":"CLICK OR PRESS 1 / 2 / 3","quiz.thanks":"THANKS!","quiz.score":"BEFORE: {a}/3   AFTER: {b}/3","debrief.title":"WHAT YOU JUST DID","debrief.1":"NEUTRINOS COME IN THREE FLAVOURS AND CHANGE FLAVOUR AS THEY TRAVEL. HOW MUCH DEPENDS ON DISTANCE / ENERGY (L/E).","debrief.2":"OSCILLATION MEANS NEUTRINOS HAVE MASS, EVEN THOUGH THE STANDARD MODEL HAD ASSUMED ZERO. NOBEL PRIZE 2015.","debrief.3":"WE SEE THEM ONLY THROUGH THE CHARGED LEPTONS THEY MAKE, AS CHERENKOV RINGS IN HUGE, DEEP, CLEAN DETECTORS. THE MASS ORDERING AND CP VIOLATION ARE STILL OPEN!","debrief.qr":"READ MORE:","debrief.url":"EN.WIKIPEDIA.ORG/WIKI/NEUTRINO_OSCILLATION","teacher.title":"TEACHER STATS (THIS COMPUTER ONLY)","teacher.runs":"RUNS STARTED","teacher.wins":"JOURNEYS COMPLETED","teacher.stage":"AVERAGE STAGE REACHED","teacher.pre":"PRE-QUIZ CORRECT","teacher.post":"POST-QUIZ CORRECT","teacher.q":"Q{n}","teacher.reset":"RESET STATS","teacher.note":"ANONYMOUS COUNTS ONLY. NOTHING LEAVES THIS BROWSER.","teacher.sure":"CLICK AGAIN TO RESET","codex.n":"PAGE {n}/{of}","codex.0.t":"WHAT IS A NEUTRINO?","codex.0.b":"AN ELEMENTARY PARTICLE WITH NO ELECTRIC CHARGE AND A TINY MASS. IT FEELS ONLY THE WEAK FORCE AND GRAVITY, SO IT PASSES THROUGH ALMOST ANYTHING. WOLFGANG PAULI PROPOSED IT IN 1930 TO SAVE ENERGY CONSERVATION IN BETA DECAY. COWAN AND REINES FIRST CAUGHT IT AT A NUCLEAR REACTOR IN 1956. NEUTRINOS ARE THE MOST NUMEROUS MATTER PARTICLES IN THE UNIVERSE.","codex.1.t":"THREE FLAVOURS","codex.1.b":'ELECTRON, MUON AND TAU NEUTRINOS (νe, νμ, ντ). THE FLAVOUR IS THE CHARGED LEPTON A NEUTRINO IS MADE WITH, OR MAKES WHEN IT HITS SOMETHING THROUGH A W BOSON ("CHARGED CURRENT"): e (0.511 MeV), μ (106 MeV) OR τ (1777 MeV). WITH A Z BOSON ("NEUTRAL CURRENT") ALL FLAVOURS BEHAVE THE SAME. BETA DECAYS IN REACTORS MAKE ANTINEUTRINOS ('+_+"e).","codex.2.t":"OSCILLATION","codex.2.b":"EACH FLAVOUR IS A QUANTUM MIX OF THREE MASS STATES ν₁, ν₂, ν₃, DESCRIBED BY THE PMNS MATRIX (THREE ANGLES AND ONE PHASE). THE MASS STATES TRAVEL WITH SLIGHTLY DIFFERENT PHASES, SO THE MIX CHANGES ALONG THE WAY. FOR TWO FLAVOURS: P = sin²2θ · sin²(1.27 Δm² L/E), WITH Δm² IN eV², L IN KM, E IN GeV. NO MASS DIFFERENCE, NO OSCILLATION.","codex.3.t":"THE NUMBERS IN THIS GAME","codex.3.b":"sin²θ₁₂ = 0.307   sin²θ₂₃ = 0.546   sin²θ₁₃ = 0.022   δCP ≈ 1.36π   Δm²₂₁ = 7.5×10⁻⁵ eV²   Δm²₃₂ = 2.45×10⁻³ eV² (NORMAL ORDERING, PARTICLE DATA GROUP). THE GAME SOLVES THE FULL THREE-FLAVOUR EQUATION, WITH MATTER, EVERY FRAME. ONLY DISTANCES ARE SQUEEZED SO THAT AN OSCILLATION FITS ON SCREEN: AT 1 GeV, 200 PIXELS STAND FOR 980 KM.","codex.4.t":"MATTER AND THE MSW EFFECT","codex.4.b":"INSIDE MATTER, νe ALSO SCATTERS OFF ELECTRONS THROUGH THE W BOSON. THIS EXTRA ENERGY CHANGES THE MIXING (MIKHEYEV, SMIRNOV, WOLFENSTEIN). IN THE SUN IT TURNS HIGH-ENERGY νe INTO ν₂. IN THE EARTH IT BOOSTS νμ → νe FOR ONE MASS ORDERING AND "+_+"μ → "+_+"e FOR THE OTHER.","codex.5.t":"CHERENKOV LIGHT","codex.5.b":"A CHARGED PARTICLE FASTER THAN LIGHT IN A MATERIAL (c/n) EMITS LIGHT ON A CONE: cos θ = 1/(nβ). WATER, n = 1.33: 41°. AIR, n = 1.0003: 1.4°. THE PHOTOMULTIPLIERS ON THE WALLS SEE A RING: SHARP, WITH A HOLE IN THE MIDDLE, FOR A LONG MUON TRACK; BLURRED AND FILLED FOR AN ELECTRON SHOWER. THAT IS HOW SUPER-K TELLS νμ FROM νe. PAVEL CHERENKOV, NOBEL PRIZE 1958.","codex.6.t":"CATCHING THE UNCATCHABLE","codex.6.b":"BIG: SUPER-K HOLDS 50,000 TONNES OF WATER, ICECUBE A CUBIC KILOMETRE OF ANTARCTIC ICE. DEEP: A KILOMETRE OF ROCK STOPS MOST COSMIC MUONS. CLEAN: RADON, POTASSIUM-40, URANIUM AND THORIUM MAKE FAKE SIGNALS. EVEN THEN, SUPER-K SEES ONLY TENS OF SOLAR NEUTRINOS A DAY, WHILE A BILLION BILLION CROSS IT EVERY SECOND.","codex.7.t":"OPEN QUESTIONS","codex.7.b":'HOW HEAVY ARE NEUTRINOS? (KATRIN: LESS THAN 0.45 eV.) WHICH ONE IS THE HEAVIEST (MASS ORDERING)? DO NEUTRINOS AND ANTINEUTRINOS OSCILLATE DIFFERENTLY (CP VIOLATION)? IS THE NEUTRINO ITS OWN ANTIPARTICLE (MAJORANA)? IS THERE A FOURTH, "STERILE" NEUTRINO? THE NEXT GENERATION OF EXPERIMENTS IS BEING BUILT RIGHT NOW.',"q.0":"A NEUTRINO IS BORN AS A νμ. FAR AWAY IT CAN BE DETECTED AS...","q.0.a0":"ONLY A νμ","q.0.a1":"A νe, νμ OR ντ","q.0.a2":"A PHOTON","q.1":"NEUTRINO OSCILLATIONS SHOW THAT NEUTRINOS...","q.1.a0":"HAVE MASS","q.1.a1":"HAVE ELECTRIC CHARGE","q.1.a2":"ARE FASTER THAN LIGHT","q.2":"WHAT DOES A WATER DETECTOR LIKE SUPER-K ACTUALLY SEE?","q.2.a0":"THE NEUTRINO ITSELF","q.2.a1":"LIGHT FROM CHARGED PARTICLES","q.2.a2":"SOUND WAVES IN THE WATER","q.3":"HOW MUCH A NEUTRINO HAS OSCILLATED DEPENDS ON...","q.3.a0":"ITS COLOUR","q.3.a1":"DISTANCE DIVIDED BY ENERGY","q.3.a2":"THE TEMPERATURE","q.4":"WHY ARE NEUTRINO DETECTORS BUILT DEEP UNDERGROUND?","q.4.a0":"TO BLOCK COSMIC MUONS","q.4.a1":"NEUTRINOS ONLY COME FROM BELOW","q.4.a2":"TO KEEP THEM WARM","q.5":"WHAT MAKES THE ELECTRON NEUTRINOS IN THE SUN?","q.5.a0":"NUCLEAR FUSION","q.5.a1":"SUNLIGHT","q.5.a2":"MAGNETIC STORMS","q.6":"ROUGHLY HOW MANY SOLAR NEUTRINOS CROSS YOUR THUMBNAIL EACH SECOND?","q.6.a0":"ABOUT 10","q.6.a1":"ABOUT A MILLION","q.6.a2":"ABOUT 65 BILLION","q.7":"THE ANTINEUTRINOS OF A NUCLEAR REACTOR COME FROM...","q.7.a0":"BETA DECAYS OF FISSION PRODUCTS","q.7.a1":"THE COOLING TOWERS","q.7.a2":"COSMIC RAYS","q.8":"A SHARP CHERENKOV RING USUALLY MEANS...","q.8.a0":"A MUON","q.8.a1":"AN ELECTRON SHOWER","q.8.a2":"A NEUTRON","q.9":"WHICH OF THESE IS STILL UNKNOWN?","q.9.a0":"IF NEUTRINOS OSCILLATE","q.9.a1":"THE NEUTRINO MASS ORDERING","q.9.a2":"IF NEUTRINOS EXIST","en.spiderling":"BETA ELECTRON","en.spiderling.f":"BETA DECAY: n → p + e⁻ + "+_+"e. THE ELECTRON YOU SEE, THE ANTINEUTRINO YOU DO NOT.","en.spider":"THORIUM-232","en.spider.f":"THORIUM AND URANIUM DECAYING INSIDE THE EARTH MAKE GEONEUTRINOS.","en.cyclops":"EXCITED NUCLEUS","en.cyclops.f":"A NUCLEUS WITH SPARE ENERGY GETS RID OF IT AS A GAMMA RAY.","en.beast":"FAST NEUTRON","en.beast.f":"FAST NEUTRONS CAN FAKE A NEUTRINO SIGNAL. DETECTORS HIDE BEHIND WATER AND ROCK.","en.blob":"URANIUM-235","en.blob.f":"ONE FISSION RELEASES ABOUT 200 MeV AND, THROUGH LATER DECAYS, ABOUT SIX ANTINEUTRINOS.","en.blobling":"FISSION FRAGMENT","en.blobling.f":"FISSION FRAGMENTS HAVE TOO MANY NEUTRONS. THEIR BETA DECAYS MAKE REACTOR ANTINEUTRINOS.","en.bat":"COSMIC MUON","en.bat.f":"ABOUT ONE COSMIC MUON CROSSES YOUR HAND EVERY SECOND.","en.ghost":"DARK NOISE","en.ghost.f":"PHOTOMULTIPLIERS SOMETIMES CLICK WITHOUT ANY LIGHT. THAT IS DARK NOISE.","en.shroom":"POTASSIUM-40","en.shroom.f":"A BANANA HAS ABOUT 15 K-40 DECAYS PER SECOND, YOUR BODY ABOUT 4,000.","en.imp":"SOLAR PLASMA","en.imp.f":"THE SUN'S CORE IS A 15-MILLION-DEGREE SOUP OF BARE NUCLEI AND ELECTRONS.","en.golem":"COSMIC PROTON","en.golem.f":"MOST COSMIC RAYS ARE PROTONS FROM SPACE. THEIR CRASHES IN THE AIR MAKE ATMOSPHERIC NEUTRINOS.","en.bomb":"RADON-222","en.bomb.f":"A RADIOACTIVE GAS THAT SEEPS OUT OF ROCK: A BIG HEADACHE FOR LOW-ENERGY DETECTORS.","en.toad":"TUNNELING ALPHA","en.toad.f":"ALPHA DECAY AND SOLAR FUSION BOTH NEED QUANTUM TUNNELLING THROUGH A BARRIER.","en.snail":"TRITIUM","en.snail.f":"TRITIUM BETA DECAY (HALF-LIFE 12.3 YEARS) IS HOW KATRIN WEIGHS THE NEUTRINO.","en.jelly":"PLASMA BLOB","en.jelly.f":"PLASMA, THE FOURTH STATE OF MATTER: ELECTRONS TORN AWAY FROM THEIR ATOMS.","en.pumpkin":"PION","en.pumpkin.f":"π → μ + νμ: PIONS ARE WHERE ATMOSPHERIC AND BEAM NEUTRINOS COME FROM.","en.cloud":"AIR SHOWER","en.cloud.f":"A SINGLE COSMIC RAY CAN MAKE BILLIONS OF SECONDARY PARTICLES IN THE AIR.","en.worm":"ROCK MUON","en.worm.f":"MUONS MADE BY NEUTRINOS IN THE SURROUNDING ROCK CAN TRAVEL KILOMETRES.","en.beetle":"ALPHA EMITTER","en.beetle.f":"AN ALPHA PARTICLE IS A HELIUM NUCLEUS. A SHEET OF PAPER STOPS IT.","en.owl":"GAMMA RAY","en.owl.f":"A GAMMA RAY IS A PHOTON WITH A MILLION TIMES THE ENERGY OF VISIBLE LIGHT.","en.mimic":"FAKE SIGNAL","en.mimic.f":"NOT EVERY BLIP IS A NEUTRINO. ANALYSES MUST REJECT LOOK-ALIKES.","en.frost":"SOLAR PHOTON","en.frost.f":"LIGHT NEEDS TENS OF THOUSANDS OF YEARS TO STAGGER OUT OF THE SUN. NEUTRINOS NEED TWO SECONDS.","en.moth":"SOLAR WIND","en.moth.f":"THE SUN BLOWS OUT CHARGED PARTICLES AT ABOUT 400 KM PER SECOND.","en.totem":"SPALLATION","en.totem.f":"A FAST MUON CAN SMASH A NUCLEUS. THE PIECES DECAY LATER AND FAKE SIGNALS.","en.fairy":"SYSTEMATIC ERROR","en.fairy.f":"SYSTEMATIC ERRORS DO NOT SHRINK WITH MORE DATA. CAREFUL CALIBRATION FIGHTS THEM.","en.dummy":"TEST TARGET","en.dummy.f":"CALIBRATION SOURCES WITH A KNOWN ENERGY TEACH A DETECTOR WHAT IT SEES.","en.brood":"THE CP PHASE","en.blobqueen":"THE MISSING SOLAR NEUTRINOS","en.warden":"THE HIDDEN ANGLE θ₁₃","en.king":"THE MASS ORDERING","en.throneeye":"THE ATMOSPHERIC ANOMALY","en.brood.sub":"MATTER OR ANTIMATTER?","en.blobqueen.sub":"WHERE DID TWO THIRDS GO?","en.warden.sub":"THE LAST MIXING ANGLE","en.king.sub":"WHICH NEUTRINO IS HEAVIEST?","en.throneeye.sub":"TOO FEW FROM BELOW","en.new":"NEW","elite.0":"HIGH-ENERGY","elite.1":"RELATIVISTIC","elite.2":"HEAVY","elite.3":"EXCITED","elite.4":"HOT","elite.5":"POLARISED","order.normal":"NORMAL","order.inverted":"INVERTED","card.rarity.common":"COMMON","card.rarity.uncommon":"UNCOMMON","card.rarity.rare":"RARE","card.rarity.boss":"BOSS","c ard.phoenix":"DESPERATE REMEDY","card.phoenix.d":"ONCE PER RUN: CHEAT ABSORPTION WITH 10 HP.","card.phoenix.f":'PAULI CALLED HIS NEUTRINO IDEA "A DESPERATE REMEDY".',"card.prism":"BETA DECAY","card.prism.d":"KILLS SPLIT INTO 3 SMALL LEPTONS.","card.prism.f":"ONE NEUTRON BECOMES THREE PARTICLES: n → p + e + "+_+"e.","card.wisp":"STERILE NEUTRINO","card.wisp.d":"A SHY COMPANION ORBITS YOU AND ZAPS ENEMIES.","card.wisp.f":'A FOURTH, "STERILE" NEUTRINO WOULD NOT EVEN FEEL THE WEAK FORCE.',"card.molten":"SOLAR CORE","card.molten.d":"LEPTONS SET ENEMIES ON FIRE.","card.molten.f":"FUSION IN THE CORE KEEPS IT AT 15 MILLION °C.","card.crown":"HYPER-KAMIOKANDE","card.crown.d":"+2 PARALLEL LEPTONS, -20% THROW RATE.","card.crown.f":"THE NEXT GIANT WATER DETECTOR, STARTING LATE THIS DECADE.","card.key":"COLLABORATION","card.key.d":"SHOP: +1 CARD AND -25% PRICES.","card.key.f":"DUNE HAS MORE THAN 1,400 SCIENTISTS FROM OVER 35 COUNTRIES.","card.boost":"ACCELERATOR UPGRADE","card.boost.d":"ENERGY ×2: YOU OSCILLATE HALF AS FAST. +1 DAMAGE.","card.boost.f":"OSCILLATIONS DEPEND ON L/E: DOUBLE THE ENERGY, DOUBLE THE DISTANCE PER OSCILLATION.","tick.0.0":"TRIGA FUEL IS SAFE BY DESIGN: IF IT HEATS UP, THE CHAIN REACTION SLOWS DOWN BY ITSELF.","tick.0.1":"THE WATER ABOVE THE CORE SHIELDS THE HALL, SO YOU CAN LOOK STRAIGHT DOWN AT IT.","tick.0.2":"IN THIS GAME, 200 PIXELS OF TRAVEL ARE ONE FULL μ → τ → μ SWING.","tick.1.0":"SUNLIGHT IS 8 MINUTES OLD. SOLAR NEUTRINOS TELL YOU WHAT THE CORE DID 8 MINUTES AGO.","tick.1.1":"BOREXINO (ITALY) MEASURED NEUTRINOS FROM NEARLY ALL OF THE SUN'S FUSION REACTIONS.","tick.1.2":"NIGHT AND DAY: SOLAR NEUTRINOS CROSSING THE EARTH AT NIGHT REGAIN A LITTLE νe.","tick.1.3":"THE SUN SHINES BECAUSE OF THE WEAK FORCE: p + p → d + e⁺ + νe.","tick.2.0":"EACH DAYA BAY DETECTOR HELD 20 TONNES OF LIQUID SCINTILLATOR WITH GADOLINIUM.","tick.2.1":"THE WATER POOL CAUGHT COSMIC MUONS BY THEIR CHERENKOV LIGHT, SO THEY COULD BE VETOED.","tick.2.2":"COWAN AND REINES DISCOVERED THE NEUTRINO AT A REACTOR IN 1956.","tick.2.3":"REACTOR ANTINEUTRINOS ARE CAUGHT BY INVERSE BETA DECAY: "+_+"e + p → n + e⁺.","tick.3.0":"FROM ABOVE: 15 KM OF TRAVEL. FROM BELOW: 13,000 KM. SAME ENERGY, DIFFERENT L.","tick.3.1":"EACH AUGER TANK HOLDS 12 TONNES OF WATER WATCHED BY 3 PHOTOMULTIPLIERS.","tick.3.2":"THE TANKS RUN ON SOLAR POWER AND SEND THEIR DATA BY RADIO.","tick.4.0":"ICECUBE WATCHES A CUBIC KILOMETRE OF ICE AT THE SOUTH POLE WITH 5,160 SENSORS.","tick.4.1":"THE HOLES FOR THE STRINGS WERE MELTED 2.5 KM DEEP WITH HOT WATER.","tick.4.2":"ICETOP: ON THE SURFACE, TANKS OF CLEAR ICE CATCH COSMIC-RAY SHOWERS.","tick.5.0":"T2K SENDS ITS BEAM 295 KM FROM TOKAI TO KAMIOKA, THROUGH THE ROCK.","tick.5.1":"WATER IN SUPER-K IS SO CLEAN THAT LIGHT CROSSES THE WHOLE TANK.","tick.5.2":"WHILE THE TANK IS REFILLED, CREWS CHECK THE PHOTOMULTIPLIERS FROM BOATS.","tick.0.3":"CHERENKOV LIGHT IS BLUE: THE EFFECT MAKES MORE LIGHT AT SHORTER WAVELENGTHS.","tick.2.4":"THE KRŠKO PLANT HAS RUN SINCE 1983 AND IS SHARED BY SLOVENIA AND CROATIA.","tick.3.3":"TAKAAKI KAJITA AND ARTHUR McDONALD SHARED THE 2015 NOBEL PRIZE FOR OSCILLATIONS.","tick.4.3":"IN 2013 ICECUBE FOUND THE FIRST HIGH-ENERGY NEUTRINOS FROM OUTSIDE THE SOLAR SYSTEM.","tick.4.4":"KM3NET IS BUILDING NEUTRINO TELESCOPES ON THE MEDITERRANEAN SEA FLOOR.","tick.5.3":"IN 2001 A CHAIN REACTION OF IMPLODING PMTS DESTROYED MORE THAN HALF OF THEM. SUPER-K WAS REBUILT."},Eo={title:"FLAVOUR SHIFT",subtitle:"POT NEVTRINA",press:"PRITISNI ENTER ALI KLIKNI ZA IGRO","menu.play":"IGRAJ","menu.tutorial":"ZAČNI Z VAJO","menu.skip":"PRESKOČI VAJO","menu.settings":"NASTAVITVE","menu.fullscreen.on":"CELOTEN ZASLON (F)","menu.fullscreen.off":"IZHOD IZ CELOTNEGA ZASLONA (ESC)","menu.teacher":"ZA UČITELJE","menu.scores":"NAJBOLJŠI","menu.codex":"FIZIKALNI PRIROČNIK","menu.quiz":"KRATEK KVIZ","menu.back":"NAZAJ","menu.resume":"NADALJUJ","menu.restart":"ZAČNI ZNOVA","menu.quit":"NA ZAČETEK","menu.continue":"NAPREJ","menu.next":"NAPREJ"," H SREDIC. SI ELEKTRONSKI ANTINEVTRINO ("+_+"e) S 4 MeV. OPAZUJ MAJHEN HITER UPAD (θ₁₃, ODKRIT TU LETA 2012) IN VELIK POČASEN UPAD (θ₁₂, KAMLAND).","stage.3.name":"OZRAČJE","stage.3.where":"NAD OBSERVATORIJEM PIERRE AUGER, ARGENTINA","stage.3.body":"KOZMIČNI ŽARKI IZ VESOLJA VISOKO NAD TLEMI TREŠČIJO V JEDRA V ZRAKU IN USTVARIJO PLAZOVE PIONOV, KI RAZPADEJO V MIONE IN MIONSKE NEVTRINE. OBSERVATORIJ PIERRE AUGER TAKE PLAZOVE LOVI S 1.660 VODNIMI REZERVOARJI, KOT JE TA, RAZPOREJENIMI NA 3.000 KM². SI νμ Z 1 GeV. V NEKAJ STO KM PRENIHAŠ IZ μ V τ IN NAZAJ: TAKO SO LETA 1998 ODKRILI OSCILACIJE.","stage.4.name":"SKOZI ZEMLJO DO ICECUBA","stage.4.where":"NAVZGOR SKOZI VSO ZEMLJO, V LED JUŽNEGA TEČAJA","stage.4.body":'PRIŠEL SI NAVZGOR SKOZI VSO ZEMLJO, NEDOTAKNJEN, KOT SKORAJ VSAK NEVTRINO. SI νμ S 6 GeV, GOSTA KAMNINA POMAGA νμ, DA SE SPREMENI V νe, A LE, ČE JE VRSTNI RED MAS "NORMALEN". ZDAJ SI V ICECUBU: 5.160 SENZORJEV SVETLOBE NA 86 VRVEH, 1,5 DO 2,5 KM GLOBOKO V ANTARKTIČNEM LEDU. STAVBA NA VRHU JE LABORATORIJ ICECUBE.',"stage.5.name":"SUPER-KAMIOKANDE","stage.5.where":"1 KM POD GORO IKENO, JAPONSKA","stage.5.body":"41 M VISOK JEKLEN REZERVOAR S 50.000 TONAMI ZELO ČISTE VODE, OBDAN Z 11.000 FOTOPOMNOŽEVALKAMI. SI νμ IZ ŽARKA T2K, POSLAN 295 KM SKOZI KAMNINO IZ TOKAIJA, Z 0,6 GeV. TVOJI LEPTONI NA STENAH RIŠEJO OBROČE ČERENKOVE SVETLOBE: OSTRE ZA μ, ZABRISANE ZA e.","stage.real":"PRAVI POSKUSI","stage.0.short":"VAJA","stage.1.short":"SONCE","stage.2.short":"DAYA BAY","stage.3.short":"OZRAČJE","stage.4.short":"ICECUBE","stage.5.short":"SUPER-K","stage.you":"TI","stage.energy":"ENERGIJA","stage.matter":"SNOV","stage.medium":"SVETLOBA TU","medium.water":"VODA: ČERENKOV STOŽEC 41°","medium.plasma":"PLAZMA: NEPROZORNA, SVETLOBA SE IZGUBI","medium.air":"ZRAK: OZEK STOŽEC 1,4°","medium.rock":"KAMNINA: NEPROZORNA","medium.ice":"LED: ČERENKOV STOŽEC 40°","sun.core":"JEDRO · 15 MILIJONOV °C","sun.rad":"SEVALNA PLAST","sun.rad.sub":"SVETLOBA SE PREBIJA VEN","sun.conv":"KONVEKCIJSKA PLAST","sun.surf":"POVRŠJE · 5500 °C","sun.corona":"KORONA · MILIJONI °C","photo.juno":"SLIKA: DETEKTOR JUNO, KITAJSKA","photo.core":"SLIKA: SREDICA RAZISKOVALNEGA REAKTORJA","matter.0":"SKORAJ NIČ","matter.1":"ZELO GOSTA, VSE REDKEJŠA (MSW)","matter.2":"VODA (PREMALO, DA BI ŠTELO)","matter.3":"REDEK ZRAK","matter.4":"VSA ZEMLJA (UČINEK SNOVI)","matter.5":"VODA (PREMALO, DA BI ŠTELO)","boss.blobqueen.intro":"1968: RAY DAVIS JE GLOBOKO V RUDNIKU HOMESTAKE S 615 TONAMI ČISTILNE TEKOČINE ŠTEL SONČEVE νe. NAŠEL JE LE OKOLI TRETJINO TEGA, KAR BI SONCE MORALO USTVARITI. 30 LET NIHČE NI VEDEL, KAM GRE PREOSTANEK.","boss.blobqueen.tip":"ŠIBKO NA μ IN τ. TVOJ Z-SUNEK (DESNI KLIK) VIDI VSE OKUSE: ZADENE ×3.","boss.blobqueen.defeat":"2001-2002: SNO V KANADI JE S TEŽKO VODO HKRATI ŠTEL LE νe (NABITI TOK) IN VSE OKUSE (NEVTRALNI TOK). VSI OKUSI SKUPAJ SO DALI CELOTEN SONČEV TOK: NIČ NI MANJKALO, νe SO SE SPREMENILI V νμ IN ντ. NOBELOVI NAGRADI 2002 (DAVIS, KOSHIBA) IN 2015 (McDONALD).","boss.warden.intro":"TRIJE KOTI MEŠANJA POVEDO, KAKO SE MEŠAJO OKUSI IN MASNA STANJA. θ₁₂ IN θ₂₃ STA VELIKA. TRETJI, θ₁₃, JE BIL TAKO MAJHEN, DA JE OSTAL SKRIT DO LETA 2012.","boss.warden.tip":"ŠIBKO NA μ IN τ: NA REDKE ANTINEVTRINE, KI NEHAJO BITI e.","boss.warden.defeat":"2012: DAYA BAY (KITAJSKA), RENO (KOREJA) IN DOUBLE CHOOZ (FRANCIJA) SO VIDELI, DA PO 1-2 KM IZGINE OKOLI 6% REAKTORSKIH ANTINEVTRINOV: θ₁₃ ≈ 8,6°. MAJHEN, A NE NIČ, IN ZATO JE ISKANJE KRŠITVE CP SPLOH MOGOČE.","boss.throneeye.intro":"V 80. IN 90. LETIH SO DETEKTORJI NAŠTELI PREMALO MIONSKIH NEVTRINOV IZ OZRAČJA. NAPAKA V MODELIH? ALI NEKAJ NOVEGA?","boss.throneeye.tip":"μ MU NE MORE DO ŽIVEGA. ZADENI GA S τ: TO SO POSTALI MANJKAJOČI νμ.","boss.throneeye.defeat":"1998: SUPER-KAMIOKANDE JE POKAZAL, DA MANJKAJO νμ, KI PRIHAJAJO OD SPODAJ SKOZI ZEMLJO (13.000 KM), TISTI OD ZGORAJ (15 KM) PA NE. PRIMANJKLJAJ JE NATANKO SLEDIL L/E: OSCILACIJE! PRVI DOKAZ, DA IMAJO NEVTRINI MASO. NOBELOVA NAGRADA 2015 (KAJITA).","boss.king.intro":'POZNAMO RAZLIKE KVADRATOV NEVTRINSKIH MAS, NE PA NJIHOVEGA VRSTNEGA REDA. JE ν₃ NAJTEŽJI ("NORMALNO") ALI NAJLAŽJI ("OBRNJENO")?',"boss.king.tip":"OBRAČA SVOJ VRSTNI RED. NORMALNO: ŠIBEK NA e. OBRNJENO: ŠIBEK NA μ.","boss.king.defeat":"ŠE VEDNO ODPRTO VPRAŠANJE! JUNO (KITAJSKA), DUNE (ZDA), HYPER-KAMIOKANDE (JAPONSKA), ICECUBE IN KM3NET/ORCA V SREDOZEMLJU ISKAJO ODGOVOR. SNOV V ZEMLJI OKREPI νμ→νe LE PRI ENEM OD OBEH VRSTNIH REDOV.","boss.brood.intro":"FAZA δCP BI LAHKO POVZROČILA, DA NEVTRINI IN ANTINEVTRINI OSCILIRAJO RAZLIČNO. TO BI LAHKO POMAGALO RAZLOŽITI, ZAKAJ JE VESOLJE IZ SNOVI IN NE IZ ANTISNOVI.","boss.brood.tip":"NJEGOVA ŠIBKOST SE VRTI Z KAZALCEM. NA POL POTI TE ŽAREK SPREMENI V ANTINEVTRINO.","boss.brood.defeat":"ŠE ODPRTO! T2K IN NOVA VIDITA NAMIGE. DUNE IN HYPER-KAMIOKANDE, KI ZAČNETA KONEC 2020-IH, CILJATA NA ODKRITJE. MORDA BOŠ V EKIPI TUDI TI.","boss.history":"ZGODOVINA","boss.tip":"KAKO GA PREMAGAŠ","boss.solved":"REŠENO","boss.open":"ŠE ODPRTO","pop.throw0.t":"ELEKTRON!","pop.throw0.b":'TVOJ νe JE ZADEL JEDRO IN SE Z IZMENJAVO BOZONA W ("NABITI TOK") SPREMENIL V ELEKTRON. LAHEK ELEKTRON SE VELIKO SIPA IN USTVARI PLAZ DELCEV: NJEGOV ČERENKOV STOŽEC JE ZABRISAN IN POLN, NA STENI PA NASTANE MEGLEN OBROČ.',"pop.throw1.t":"MION!","pop.throw1.b":"MION JE 200-KRAT TEŽJI OD ELEKTRONA. LETI NARAVNOST IN DALEČ, PREBODE VSE NA SVOJI POTI. NJEGOV ČERENKOV STOŽEC JE OSTER IN VOTEL: KO SE SLED KONČA, SVETLOBA LETI NAPREJ KOT OBROČ Z LUKNJO NA SREDINI.","pop.throw2.t":"TAUON!","pop.throw2.b":'TAUON JE 3.500-KRAT TEŽJI OD ELEKTRONA IN RAZPADE SKORAJ TAKOJ: EN POK, KJER NASTANE, DRUGI, KJER RAZPADE. ICECUBE IŠČE TAKŠNE "DVOJNE POKE".',"pop.dice.t":"KVANTNA KOCKA","pop.dice.b":"KATERI LEPTON VRŽEŠ, ODLOČI NAKLJUČJE. STOLPCI KAŽEJO VERJETNOSTI: 70% μ POMENI, DA JE SEDEM OD DESETIH METOV MIONOV. KVANTNA MEHANIKA DA LE VERJETNOSTI.","pop.cherenkov.t":"ČERENKOVA SVETLOBA","pop.cherenkov.b":"V VODI SVETLOBA POTUJE LE S 75% SVOJE HITROSTI V VAKUUMU. NABIT DELEC, KI JE HITREJŠI, ZA SABO PUSTI STOŽEC MODRE SVETLOBE, KOT ZVOČNI POK LETALA: cos θ = 1/(nβ), V VODI 41°.","pop.osc.t":"SPREMENIL SI OKUS!","pop.osc.b":"NEVTRINO JE MEŠANICA TREH MASNIH STANJ ν₁, ν₂, ν₃. POTUJEJO Z MALO RAZLIČNIMI RITMI, ZATO SE MEŠANICA IN S TEM TVOJ OKUS SPREMINJATA Z RAZDALJO / ENERGIJO (L/E). TO JE MOGOČE LE, ČE IMAJO NEVTRINI MASO.","pop.pass.t":"ŠLO JE SKOZI TEBE","pop.pass.b":"NEVTRINI SKORAJ NIKOLI NE INTERAGIRAJO. SVETLOBNO LETO SVINCA BI USTAVILO LE OKOLI POLOVICO SONČEVIH NEVTRINOV. TU GRE SKOZI TEBE OKOLI POLOVICA VSEH ZADETKOV.","pop.nc.t":"NEVTRALNI TOK","pop.nc.b":"Z BOZONOM Z SE NEVTRINO LAHKO ZALETI V SNOV, NE DA BI POSTAL NABIT LEPTON. ZA VSE OKUSE DELUJE ENAKO, ZATO NE POZNA ŠIBKOSTI. SNO JE Z NJIM PREŠTEL VSE SONČEVE NEVTRINE.","pop.w.t":"BOZON W: SI NABIT LEPTON","pop.w.b":"KO NEVTRINO ABSORBIRA W, POSTANE SVOJ NABITI PARTNER. NABITI DELCI ČUTIJO ELEKTRIČNE SILE: NIČ VEČ NE GRE SKOZI TEBE, A ZADENEŠ MOČNEJE IN SIJEŠ ČERENKOVO SVETLOBO. TEŽKI LEPTONI NE ŽIVIJO DOLGO...","pop.wend.0.t":"ZAJETJE ELEKTRONA","pop.wend.0.b":"ELEKTRONI SO STABILNI. TU TE ZAJAME PROTON (e + p → n + νe) IN SPET SI νe.","pop.wend.1.t":"RAZPAD MIONA","pop.wend.1.b":"MION ŽIVI 2,2 MIKROSEKUNDE, NATO RAZPADE: μ → e + "+_+"e + νμ. SPET SI νμ.","pop.wend.2.t":"RAZPAD TAUONA","pop.wend.2.b":'TAUON ŽIVI 0,3 PIKOSEKUNDE. PRI RAZPADU VEDNO NASTANE ντ ("OBNOVA TAUONA"): SPET SI ντ.',"pop.msw.t":"UČINEK MSW","pop.msw.b":"ELEKTRONSKI NEVTRINI SE SIPAJO TUDI NA SONČEVIH ELEKTRONIH. TA DODATNI POTISK SPREMENI MEŠANJE. KJER JE GOSTOTA RAVNO PRAVA, SE νe GLADKO SPREMENI V ν₂, ν₂ PA ZAPUSTI SONCE KOT PRIBLIŽNO 1/3 νe IN 2/3 νμ + ντ.","pop.anti.t":"ANTINEVTRINI","pop.anti.b":"REAKTORJI USTVARJAJO ELEKTRONSKE ANTINEVTRINE ("+_+'e), ANTISNOVNE DVOJČKE νe. OSCILIRAJO ENAKO, RAZEN FAZE CP. ČRTICA NAD ν POMENI "ANTI".',"pop.flip.t":"NEVTRINO ALI ANTINEVTRINO?","pop.flip.b":"POSKUSI Z ŽARKI OBRNEJO TOK V MAGNETNIH ROGOVIH IN DOBIJO "+_+"μ NAMESTO νμ. ČE OBOJI OSCILIRAJO RAZLIČNO, JE SIMETRIJA CP KRŠENA. ZDAJ SI "+_+"μ!","pop.evidence.t":"3σ: MOČAN NAMIG","pop.evidence.b":"ZNAČILNOST RASTE S KVADRATNIM KORENOM ŠTEVILA DOGODKOV: ŠTIRIKRAT VEČ PODATKOV DA DVAKRAT VEČ σ. PRI 3σ BI BIL NAKLJUČEN ODKLON TAKO VELIK LE V 0,3% PRIMEROV. TO ŠE NI ODKRITJE.","pop.discovery.t":"5σ: ODKRITJE!","pop.discovery.b":"PRI 5σ JE MOŽNOST NAKLJUČJA MANJ KOT 1 PROTI 3,5 MILIJONA. TO JE PRAVILO ZA ODKRITJE V FIZIKI DELCEV, UPORABLJENO ZA OSCILACIJE IN ZA HIGGSOV BOZON.","pop.arcade.t":"ARKADNI NAČIN","pop.arcade.b":"V ARKADNEM NAČINU VSAK IZMIK PREPROSTO PREKLOPI e → μ → τ. PRAVI NEVTRINI SE SPREMINJAJO GLADKO: POSKUSI NAČIN PRAVIH OSCILACIJ.","pop.more":"VEČ V FIZIKALNEM PRIROČNIKU (MENI PREMOR)","tut.move":"PREMIKAJ SE Z A / D (ALI ← →)","tut.jump":"SKOČI Z W, ↑ ALI PRESLEDNICO. DRŽI ZA VIŠJE SKOKE.","tut.throw":"MERI Z MIŠKO IN VRZI LEPTON Z LEVIM GUMBOM ALI E. DRŽI ZA NEPREKINJENO METANJE.","tut.bars":"SPODAJ: TVOJA MEŠANICA OKUSOV. ORANŽNA e, ŠKRLATNA μ, VIJOLIČNA τ. VSAK MET JE ŽREB S TEMI VERJETNOSTMI.","tut.travel":"ZDAJ SE SPREHODI IN OPAZUJ STOLPCE: POTOVANJE SPREMINJA TVOJ OKUS. TO SO OSCILACIJE!","tut.dodge":"IZMAKNI SE S SHIFT. IZMIK JE HITER SKOK V RAZDALJI: OBRNE μ ↔ τ.","tut.weak":"ČRKA NAD TARČO JE NJEN ŠIBKI OKUS (×2, OSTALI ×0,6). STOJ PRI MIRU, DA OHRANIŠ OKUS, PREMIKAJ SE, DA GA SPREMENIŠ.","tut.nc":"Z-SUNEK: DESNI GUMB MIŠKE, Z ALI Q. ZADENE VSE BLIZU, NE GLEDE NA OKUS.","tut.w":"BOZON W! DOTAKNI SE GA IN ZA NEKAJ SEKUND POSTANI NABIT LEPTON.","tut.wave":"ZADNJI PREIZKUS: PREŽIVI PLOHO KOZMIČNIH MIONOV!","tut.done":"VAJA KONČANA!","tut.skip":"TAB: PRESKOČI KORAK","tut.step":"VAJA {n}/{of}","cr.title":"KONTROLNA SOBA","cr.cleared":"STOPNJA {n} OPRAVLJENA","cr.events":"DOGODKI","cr.time":"ČAS","cr.data":"ZBRANI PODATKI","cr.throws":"VRŽENI LEPTONI","cr.cards":"KARTICE","cr.quiz":"KVIZ ZA BONUS","cr.repair":"POPRAVI +8 ŽIV. ({p})","cr.next":"NASLEDNJA STOPNJA","cr.buy":"KUPI","cr.sold":"PRODANO","cr.reroll":"NOVE KARTICE {n}","cr.nodata":"PREMALO PODAT {of}","codex.0.t":"KAJ JE NEVTRINO?","codex.0.b":"OSNOVNI DELEC BREZ ELEKTRIČNEGA NABOJA IN Z DROBCENO MASO. ČUTI LE ŠIBKO SILO IN GRAVITACIJO, ZATO GRE SKOZI SKORAJ VSE. WOLFGANG PAULI GA JE PREDLAGAL LETA 1930, DA BI REŠIL OHRANITEV ENERGIJE PRI RAZPADU BETA. COWAN IN REINES STA GA PRVIČ UJELA PRI JEDRSKEM REAKTORJU LETA 1956. NEVTRINI SO NAJŠTEVILNEJŠI DELCI SNOVI V VESOLJU.","codex.1.t":"TRIJE OKUSI","codex.1.b":'ELEKTRONSKI, MIONSKI IN TAUONSKI NEVTRINO (νe, νμ, ντ). OKUS JE NABITI LEPTON, S KATERIM NEVTRINO NASTANE ALI KI GA USTVARI, KO PREK BOZONA W ("NABITI TOK") NEKAJ ZADENE: e (0,511 MeV), μ (106 MeV) ALI τ (1777 MeV). Z BOZONOM Z ("NEVTRALNI TOK") SE VSI OKUSI OBNAŠAJO ENAKO. RAZPADI BETA V REAKTORJIH USTVARJAJO ANTINEVTRINE ('+_+"e).","codex.2.t":"OSCILACIJE","codex.2.b":"VSAK OKUS JE KVANTNA MEŠANICA TREH MASNIH STANJ ν₁, ν₂, ν₃, KI JO OPISUJE MATRIKA PMNS (TRIJE KOTI IN ENA FAZA). MASNA STANJA POTUJEJO Z MALO RAZLIČNIMI FAZAMI, ZATO SE MEŠANICA MED POTJO SPREMINJA. ZA DVA OKUSA: P = sin²2θ · sin²(1,27 Δm² L/E), Δm² V eV², L V KM, E V GeV. BREZ RAZLIKE MAS NI OSCILACIJ.","codex.3.t":"ŠTEVILKE V TEJ IGRI","codex.3.b":"sin²θ₁₂ = 0,307   sin²θ₂₃ = 0,546   sin²θ₁₃ = 0,022   δCP ≈ 1,36π   Δm²₂₁ = 7,5×10⁻⁵ eV²   Δm²₃₂ = 2,45×10⁻³ eV² (NORMALNI VRSTNI RED, PARTICLE DATA GROUP). IGRA VSAKO SLIČICO REŠI CELOTNO ENAČBO ZA TRI OKUSE, S SNOVJO. LE RAZDALJE SO STISNJENE, DA OSCILACIJA PADE NA ZASLON: PRI 1 GeV 200 PIKSLOV POMENI 980 KM.","codex.4.t":"SNOV IN UČINEK MSW","codex.4.b":"V SNOVI SE νe PREK BOZONA W SIPA TUDI NA ELEKTRONIH. TA DODATNA ENERGIJA SPREMENI MEŠANJE (MIHEJEV, SMIRNOV, WOLFENSTEIN). V SONCU SPREMENI VISOKOENERGIJSKE νe V ν₂. V ZEMLJI OKREPI νμ → νe ZA EN VRSTNI RED MAS IN "+_+"μ → "+_+"e ZA DRUGEGA.","codex.5.t":"ČERENKOVA SVETLOBA","codex.5.b":"NABIT DELEC, HITREJŠI OD SVETLOBE V SNOVI (c/n), SEVA SVETLOBO NA STOŽCU: cos θ = 1/(nβ). VODA, n = 1,33: 41°. ZRAK, n = 1,0003: 1,4°. FOTOPOMNOŽEVALKE NA STENAH VIDIJO OBROČ: OSTER IN Z LUKNJO NA SREDIN
